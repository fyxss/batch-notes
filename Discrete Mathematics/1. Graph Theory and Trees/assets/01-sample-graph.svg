<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">

  <defs>
    <!-- Linear Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="240" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  
  <text x="300" y="28" fill="#f8fafc" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Graph Representation Reference Model</text>
  <text x="300" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Sample 4-vertex graph G used for Adjacency Matrix and Adjacency List analysis</text>

  <g transform="translate(180, 50)">
    <!-- Edges -->
    <line x1="60" y1="40" x2="180" y2="40" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="60" y1="40" x2="60" y2="140" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="60" y1="40" x2="180" y2="140" stroke="#f59e0b" stroke-width="2.5" />
    <line x1="180" y1="40" x2="180" y2="140" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="60" y1="140" x2="180" y2="140" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Node a -->
    <circle cx="60" cy="40" r="18" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="60" y="46" fill="#ffffff" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">a</text>
    
    <!-- Node b -->
    <circle cx="180" cy="40" r="18" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="180" y="46" fill="#ffffff" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">b</text>
    
    <!-- Node c -->
    <circle cx="60" cy="140" r="18" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="60" y="146" fill="#ffffff" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">c</text>
    
    <!-- Node d -->
    <circle cx="180" cy="140" r="18" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="180" y="146" fill="#ffffff" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">d</text>
  </g>
  
  <rect x="150" y="200" width="300" height="26" rx="6" fill="#182234" stroke="#334155" stroke-width="1" />
  <text x="300" y="217" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">V = {a, b, c, d} • E = {(a,b), (a,c), (a,d), (b,d), (c,d)}</text>
</svg>