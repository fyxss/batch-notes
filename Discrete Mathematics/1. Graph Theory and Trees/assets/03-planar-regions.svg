<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-darknode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="680" height="280" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="340" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Planar Regions &amp; Euler's Formula: v - e + r = 2</text>
  <text x="340" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Every planar representation partitions the plane into bounded faces and exactly 1 unbounded face (R₃).</text>

  <g transform="translate(140, 60)">
    <!-- Unbounded exterior border indicator -->
    <rect x="-30" y="0" width="460" height="175" rx="8" fill="#182234" stroke="#64748b" stroke-dasharray="3 3" stroke-width="1.5" />
    <text x="200" y="22" fill="#94a3b8" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Region R₃ (Unbounded Infinite Exterior, deg = 4)</text>

    <!-- Quadrilateral 1-2-3-4 + diagonal 1-3 -->
    <polygon points="50,50 350,50 350,150 50,150" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="50" y1="50" x2="350" y2="150" stroke="#fbbf24" stroke-width="2.5" />
    
    <!-- Region labels -->
    <rect x="130" y="65" width="50" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" />
    <text x="155" y="81" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">R₁ (3)</text>
    
    <rect x="220" y="115" width="50" height="24" rx="4" fill="#1e293b" stroke="#fbbf24" />
    <text x="245" y="131" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">R₂ (3)</text>
    
    <!-- Vertices -->
    <circle cx="50" cy="50" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" filter="url(#shadow)" /><text x="50" y="54" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">1</text>
    <circle cx="350" cy="50" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" filter="url(#shadow)" /><text x="350" y="54" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">2</text>
    <circle cx="350" cy="150" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" filter="url(#shadow)" /><text x="350" y="154" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">3</text>
    <circle cx="50" cy="150" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" filter="url(#shadow)" /><text x="50" y="154" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">4</text>
  </g>

  <!-- Formula verification bar -->
  <rect x="100" y="244" width="480" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="340" y="261" fill="#34d399" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Euler Check: v = 4, e = 5, r = 3  ⟹  4 - 5 + 3 = 2  ✓ | 2e = ∑ deg(R) = 3 + 3 + 4 = 10</text>
</svg>