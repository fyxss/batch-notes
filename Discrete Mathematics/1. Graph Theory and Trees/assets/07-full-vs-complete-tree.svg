<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="740" height="250" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="370" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Full Binary Tree vs. Complete Binary Tree</text>
  <text x="370" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Strict Rosen definitions: Full requires every internal node has 2 children; Complete requires dense left filling.</text>

  <!-- Left: Full Binary Tree -->
  <g transform="translate(40, 65)">
    <rect width="310" height="165" rx="10" fill="#182234" stroke="#38bdf8" stroke-width="1.2" />
    <text x="155" y="24" fill="#38bdf8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Full Binary Tree</text>
    <text x="155" y="40" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Every node has exactly 0 or 2 children</text>
    
    <!-- Edges -->
    <line x1="155" y1="55" x2="105" y2="95" stroke="#38bdf8" stroke-width="2" />
    <line x1="155" y1="55" x2="205" y2="95" stroke="#38bdf8" stroke-width="2" />
    <line x1="105" y1="95" x2="75" y2="135" stroke="#38bdf8" stroke-width="2" />
    <line x1="105" y1="95" x2="135" y2="135" stroke="#38bdf8" stroke-width="2" />

    <circle cx="155" cy="55" r="9" fill="url(#grad-blue)" stroke="#fff" />
    <circle cx="105" cy="95" r="9" fill="url(#grad-blue)" stroke="#fff" />
    <circle cx="205" cy="95" r="9" fill="url(#grad-blue)" stroke="#fff" />
    <circle cx="75" cy="135" r="8" fill="url(#grad-blue)" stroke="#fff" />
    <circle cx="135" cy="135" r="8" fill="url(#grad-blue)" stroke="#fff" />

    <text x="155" y="155" fill="#7dd3fc" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Internal nodes have 2 children, leaves have 0</text>
  </g>

  <!-- Right: Complete Binary Tree -->
  <g transform="translate(390, 65)">
    <rect width="310" height="165" rx="10" fill="#182234" stroke="#34d399" stroke-width="1.2" />
    <text x="155" y="24" fill="#34d399" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Complete Binary Tree</text>
    <text x="155" y="40" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">All levels filled, bottom filled left-to-right</text>
    
    <!-- Edges -->
    <line x1="155" y1="55" x2="105" y2="95" stroke="#34d399" stroke-width="2" />
    <line x1="155" y1="55" x2="205" y2="95" stroke="#34d399" stroke-width="2" />
    <line x1="105" y1="95" x2="75" y2="135" stroke="#34d399" stroke-width="2" />
    <line x1="105" y1="95" x2="135" y2="135" stroke="#34d399" stroke-width="2" />
    <line x1="205" y1="95" x2="185" y2="135" stroke="#34d399" stroke-width="2" />

    <circle cx="155" cy="55" r="9" fill="url(#grad-emerald)" stroke="#fff" />
    <circle cx="105" cy="95" r="9" fill="url(#grad-emerald)" stroke="#fff" />
    <circle cx="205" cy="95" r="9" fill="url(#grad-emerald)" stroke="#fff" />
    <circle cx="75" cy="135" r="8" fill="url(#grad-emerald)" stroke="#fff" />
    <circle cx="135" cy="135" r="8" fill="url(#grad-emerald)" stroke="#fff" />
    <circle cx="185" cy="135" r="8" fill="url(#grad-emerald)" stroke="#fff" />

    <text x="155" y="155" fill="#6ee7b7" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Packed left-aligned: ideal for array heaps</text>
  </g>
</svg>