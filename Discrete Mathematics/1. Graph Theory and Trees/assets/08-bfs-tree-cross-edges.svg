<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="720" height="270" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">BFS Spanning Tree: Tree Edges vs. Cross Edges</text>
  <text x="360" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">In an undirected graph BFS, non-tree edges are CROSS EDGES connecting vertices at the same or adjacent levels.</text>

  <g transform="translate(180, 55)">
    <!-- Level 0 (a) -->
    <line x1="180" y1="20" x2="110" y2="85" stroke="#34d399" stroke-width="3" />
    <line x1="180" y1="20" x2="250" y2="85" stroke="#34d399" stroke-width="3" />

    <!-- Level 1 (b, c) -->
    <!-- Tree edges from b to d and e -->
    <line x1="110" y1="85" x2="70" y2="155" stroke="#34d399" stroke-width="3" />
    <line x1="110" y1="85" x2="150" y2="155" stroke="#34d399" stroke-width="3" />

    <!-- CROSS EDGE: b - c on the same level -->
    <line x1="110" y1="85" x2="250" y2="85" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4 2" />

    <!-- CROSS EDGE: c - e between adjacent levels -->
    <line x1="250" y1="85" x2="150" y2="155" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 2" />

    <!-- Nodes -->
    <circle cx="180" cy="20" r="15" fill="url(#grad-emerald)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="180" y="25" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">a</text>
    <circle cx="110" cy="85" r="14" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" /><text x="110" y="89" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">b</text>
    <circle cx="250" cy="85" r="14" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" /><text x="250" y="89" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">c</text>
    <circle cx="70" cy="155" r="14" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" /><text x="70" y="159" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">d</text>
    <circle cx="150" cy="155" r="14" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" /><text x="150" y="159" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">e</text>
  </g>

  <!-- Legend -->
  <g transform="translate(480, 100)">
    <rect width="180" height="90" rx="8" fill="#182234" stroke="#334155" />
    <line x1="20" y1="30" x2="60" y2="30" stroke="#34d399" stroke-width="3" />
    <text x="75" y="34" fill="#34d399" font-size="11" font-weight="bold">Tree Edge</text>
    <line x1="20" y1="60" x2="60" y2="60" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4 2" />
    <text x="75" y="64" fill="#fbbf24" font-size="11" font-weight="bold">Cross Edge (ΔL ≤ 1)</text>
  </g>
</svg>