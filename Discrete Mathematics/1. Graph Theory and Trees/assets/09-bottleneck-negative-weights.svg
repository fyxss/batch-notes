<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="740" height="250" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="370" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Maximum Bottleneck Capacity to MST Reduction</text>
  <text x="370" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Negating edge weights w'(e) = -w(e) converts Maximum Bottleneck Spanning Tree into Standard MST.</text>

  <!-- Left: Original Road Capacities -->
  <g transform="translate(40, 65)">
    <rect width="310" height="165" rx="10" fill="#182234" stroke="#38bdf8" stroke-width="1.2" />
    <text x="155" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Original Bottleneck Capacities</text>
    
    <rect x="75" y="50" width="160" height="70" stroke="#38bdf8" stroke-width="2" fill="none" />
    <text x="155" y="45" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">50 cars/hr</text>
    <text x="50" y="90" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">30</text>
    <text x="260" y="90" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">40</text>
    <text x="155" y="135" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">20</text>

    <circle cx="75" cy="50" r="12" fill="url(#grad-blue)" stroke="#fff" /><text x="75" y="54" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">A</text>
    <circle cx="235" cy="50" r="12" fill="url(#grad-blue)" stroke="#fff" /><text x="235" y="54" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">B</text>
    <circle cx="75" cy="120" r="12" fill="url(#grad-blue)" stroke="#fff" /><text x="75" y="124" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">C</text>
    <circle cx="235" cy="120" r="12" fill="url(#grad-blue)" stroke="#fff" /><text x="235" y="124" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">D</text>

    <text x="155" y="152" fill="#94a3b8" font-size="10" text-anchor="middle">Goal: Maximize min-capacity link</text>
  </g>

  <!-- Right: Negated Weights -->
  <g transform="translate(390, 65)">
    <rect width="310" height="165" rx="10" fill="#182234" stroke="#fb7185" stroke-width="1.2" />
    <text x="155" y="24" fill="#fb7185" font-size="13" font-weight="bold" text-anchor="middle">Transformed for Minimum Spanning Tree</text>
    
    <rect x="75" y="50" width="160" height="70" stroke="#fb7185" stroke-width="2" fill="none" />
    <text x="155" y="45" fill="#fb7185" font-size="10" font-weight="bold" text-anchor="middle">-50</text>
    <text x="50" y="90" fill="#fb7185" font-size="10" font-weight="bold" text-anchor="middle">-30</text>
    <text x="260" y="90" fill="#fb7185" font-size="10" font-weight="bold" text-anchor="middle">-40</text>
    <text x="155" y="135" fill="#fb7185" font-size="10" font-weight="bold" text-anchor="middle">-20</text>

    <circle cx="75" cy="50" r="12" fill="url(#grad-rose)" stroke="#fff" /><text x="75" y="54" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">A</text>
    <circle cx="235" cy="50" r="12" fill="url(#grad-rose)" stroke="#fff" /><text x="235" y="54" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">B</text>
    <circle cx="75" cy="120" r="12" fill="url(#grad-rose)" stroke="#fff" /><text x="75" y="124" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">C</text>
    <circle cx="235" cy="120" r="12" fill="url(#grad-rose)" stroke="#fff" /><text x="235" y="124" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">D</text>

    <text x="155" y="152" fill="#fda4af" font-size="10" text-anchor="middle">Kruskal / Prim runs natively with negatives!</text>
  </g>
</svg>