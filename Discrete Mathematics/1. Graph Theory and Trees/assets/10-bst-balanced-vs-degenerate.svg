<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="740" height="270" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="370" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">BST Performance: Balanced Insertion vs. Sorted Worst-Case Degeneracy</text>
  <text x="370" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Random insertions produce balanced trees (O(log n)); sorted insertions collapse into a linked list (O(n)).</text>

  <!-- Left: Best Case Balanced -->
  <g transform="translate(40, 65)">
    <rect width="320" height="185" rx="10" fill="#182234" stroke="#059669" stroke-width="1.2" />
    <text x="160" y="24" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">Optimal / Balanced Insertion</text>
    <text x="160" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">Keys: [5, 2, 8, 1, 4, 7, 9]</text>
    
    <line x1="160" y1="55" x2="100" y2="95" stroke="#34d399" stroke-width="2" />
    <line x1="160" y1="55" x2="220" y2="95" stroke="#34d399" stroke-width="2" />
    <line x1="100" y1="95" x2="70" y2="135" stroke="#34d399" stroke-width="2" />
    <line x1="100" y1="95" x2="130" y2="135" stroke="#34d399" stroke-width="2" />
    <line x1="220" y1="95" x2="190" y2="135" stroke="#34d399" stroke-width="2" />
    <line x1="220" y1="95" x2="250" y2="135" stroke="#34d399" stroke-width="2" />

    <circle cx="160" cy="55" r="10" fill="url(#grad-emerald)" stroke="#fff" /><text x="160" y="59" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">5</text>
    <circle cx="100" cy="95" r="9" fill="url(#grad-emerald)" stroke="#fff" /><text x="100" y="99" fill="#fff" font-size="9" text-anchor="middle">2</text>
    <circle cx="220" cy="95" r="9" fill="url(#grad-emerald)" stroke="#fff" /><text x="220" y="99" fill="#fff" font-size="9" text-anchor="middle">8</text>
    <circle cx="70" cy="135" r="8" fill="url(#grad-emerald)" stroke="#fff" /><text x="70" y="138" fill="#fff" font-size="8" font-weight="bold" text-anchor="middle">1</text>
    <circle cx="130" cy="135" r="8" fill="url(#grad-emerald)" stroke="#fff" /><text x="130" y="138" fill="#fff" font-size="8" font-weight="bold" text-anchor="middle">4</text>
    <circle cx="190" cy="135" r="8" fill="url(#grad-emerald)" stroke="#fff" /><text x="190" y="138" fill="#fff" font-size="8" font-weight="bold" text-anchor="middle">7</text>
    <circle cx="250" cy="135" r="8" fill="url(#grad-emerald)" stroke="#fff" /><text x="250" y="138" fill="#fff" font-size="8" font-weight="bold" text-anchor="middle">9</text>

    <rect x="25" y="155" width="270" height="20" rx="4" fill="#0f172a" />
    <text x="160" y="169" fill="#6ee7b7" font-size="10" font-weight="bold" text-anchor="middle">Height h = 2 ≈ log₂ n • Search: O(log n)</text>
  </g>

  <!-- Right: Worst Case Degenerate -->
  <g transform="translate(390, 65)">
    <rect width="310" height="185" rx="10" fill="#182234" stroke="#e11d48" stroke-width="1.2" />
    <text x="155" y="24" fill="#fb7185" font-size="13" font-weight="bold" text-anchor="middle">Degenerate / Sorted Insertion</text>
    <text x="155" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">Keys inserted in order: [1, 2, 3, 4, 5]</text>
    
    <!-- Linear chain -->
    <line x1="70" y1="55" x2="110" y2="75" stroke="#f43f5e" stroke-width="2" />
    <line x1="110" y1="75" x2="150" y2="95" stroke="#f43f5e" stroke-width="2" />
    <line x1="150" y1="95" x2="190" y2="115" stroke="#f43f5e" stroke-width="2" />
    <line x1="190" y1="115" x2="230" y2="135" stroke="#f43f5e" stroke-width="2" />

    <circle cx="70" cy="55" r="9" fill="url(#grad-rose)" stroke="#fff" /><text x="70" y="59" fill="#fff" font-size="9" text-anchor="middle">1</text>
    <circle cx="110" cy="75" r="9" fill="url(#grad-rose)" stroke="#fff" /><text x="110" y="79" fill="#fff" font-size="9" text-anchor="middle">2</text>
    <circle cx="150" cy="95" r="9" fill="url(#grad-rose)" stroke="#fff" /><text x="150" y="99" fill="#fff" font-size="9" text-anchor="middle">3</text>
    <circle cx="190" cy="115" r="9" fill="url(#grad-rose)" stroke="#fff" /><text x="190" y="119" fill="#fff" font-size="9" text-anchor="middle">4</text>
    <circle cx="230" cy="135" r="9" fill="url(#grad-rose)" stroke="#fff" /><text x="230" y="139" fill="#fff" font-size="9" text-anchor="middle">5</text>

    <rect x="25" y="155" width="260" height="20" rx="4" fill="#0f172a" />
    <text x="155" y="169" fill="#fda4af" font-size="10" font-weight="bold" text-anchor="middle">Height h = 4 = n - 1 • Search: O(n)</text>
  </g>
</svg>