<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Linear Gradients -->
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="320" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />

  <!-- Header Title & Subtitle -->
  <text x="400" y="32" fill="#f8fafc" font-size="18" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Principle of Inclusion–Exclusion (PIE)</text>
  <text x="400" y="52" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Overcoming overlap bias: subtract double-counts, restore eliminated intersections</text>

  <!-- Left Panel: Two Sets -->
  <g transform="translate(35, 68)">
    <rect width="350" height="232" rx="10" fill="#182234" stroke="#2563eb" stroke-dasharray="3 3" stroke-width="1" />
    <text x="175" y="24" fill="#93c5fd" font-size="14" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Two Sets: |A ∪ B|</text>
    <text x="175" y="42" fill="#38bdf8" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">|A ∪ B| = |A| + |B| − |A ∩ B|</text>

    <!-- Venn Circles -->
    <circle cx="125" cy="115" r="54" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-width="2" />
    <circle cx="225" cy="115" r="54" fill="#34d399" fill-opacity="0.22" stroke="#34d399" stroke-width="2" />

    <!-- Labels -->
    <text x="85" y="65" fill="#38bdf8" font-size="13" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Set A (+1)</text>
    <text x="215" y="65" fill="#34d399" font-size="13" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Set B (+1)</text>

    <text x="100" y="119" fill="#bae6fd" font-size="13" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">A \ B</text>
    <text x="175" y="112" fill="#fbbf24" font-size="12" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">A ∩ B</text>
    <text x="175" y="128" fill="#fbbf24" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">(−1)</text>
    <text x="250" y="119" fill="#a7f3d0" font-size="13" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">B \ A</text>

    <!-- Bottom Badge -->
    <rect x="20" y="180" width="310" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="175" y="196" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Adding |A| + |B| counts intersection twice.</text>
    <text x="175" y="210" fill="#38bdf8" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Subtract |A ∩ B| once to restore balance.</text>
  </g>

  <!-- Right Panel: Three Sets -->
  <g transform="translate(415, 68)">
    <rect width="350" height="232" rx="10" fill="#182234" stroke="#7c3aed" stroke-dasharray="3 3" stroke-width="1" />
    <text x="175" y="24" fill="#c084fc" font-size="14" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Three Sets: |A ∪ B ∪ C|</text>
    <text x="175" y="42" fill="#e9d5ff" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Σ|A| − Σ|A ∩ B| + |A ∩ B ∩ C|</text>

    <!-- Venn Circles -->
    <!-- Circle A (Top) -->
    <circle cx="175" cy="98" r="46" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.8" />
    <!-- Circle B (Bottom Left) -->
    <circle cx="142" cy="138" r="46" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="1.8" />
    <!-- Circle C (Bottom Right) -->
    <circle cx="208" cy="138" r="46" fill="#fb7185" fill-opacity="0.18" stroke="#fb7185" stroke-width="1.8" />

    <!-- Center Triple Intersection Highlight -->
    <circle cx="175" cy="126" r="14" fill="#fbbf24" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1" />
    <text x="175" y="127" fill="#fbbf24" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">+1</text>
    <text x="175" y="137" fill="#fef08a" font-size="8" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">ABC</text>

    <!-- Pairwise Intersections -->
    <text x="145" y="112" fill="#cbd5e1" font-size="10" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">−1</text>
    <text x="205" y="112" fill="#cbd5e1" font-size="10" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">−1</text>
    <text x="175" y="158" fill="#cbd5e1" font-size="10" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">−1</text>

    <!-- Single Labels -->
    <text x="175" y="76" fill="#38bdf8" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">A (+1)</text>
    <text x="110" y="152" fill="#34d399" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">B (+1)</text>
    <text x="240" y="152" fill="#fb7185" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">C (+1)</text>

    <!-- Bottom Badge -->
    <rect x="20" y="180" width="310" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="175" y="196" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Center added 3×, then subtracted 3× (net 0).</text>
    <text x="175" y="210" fill="#c084fc" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Add back |A ∩ B ∩ C| (+1) to count exactly once.</text>
  </g>
</svg>
