<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Linear Gradients -->
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="320" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />

  <!-- Header Title & Subtitle -->
  <text x="400" y="32" fill="#f8fafc" font-size="18" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Two Fair Dice: Sample Space &amp; Sum Distribution</text>
  <text x="400" y="52" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Elementary pairs are equally likely (1/36), but sums from 2 to 12 are NOT equally likely</text>

  <!-- Left Panel: 6x6 Coordinate Space -->
  <g transform="translate(35, 68)">
    <rect width="350" height="232" rx="10" fill="#182234" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="1" />
    <text x="175" y="24" fill="#93c5fd" font-size="14" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Outcome Grid: |S| = 6 × 6 = 36 Pairs</text>
    <text x="175" y="42" fill="#38bdf8" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Highlighted Diagonal: Sum = 7 (6 outcomes)</text>

    <!-- Grid Layout -->
    <g transform="translate(50, 48)">
      <!-- Column headers: Die 2 -->
      <text x="35" y="14" fill="#38bdf8" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">1</text>
      <text x="75" y="14" fill="#38bdf8" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">2</text>
      <text x="115" y="14" fill="#38bdf8" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">3</text>
      <text x="155" y="14" fill="#38bdf8" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">4</text>
      <text x="195" y="14" fill="#38bdf8" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">5</text>
      <text x="235" y="14" fill="#38bdf8" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">6</text>
      <text x="262" y="14" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">Die 2</text>

      <!-- Row 1: d1=1 -->
      <text x="8" y="32" fill="#34d399" font-size="11" font-weight="bold" font-family="monospace">1</text>
      <rect x="20" y="20" width="30" height="17" rx="3" fill="#0f172a" /><text x="35" y="32" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">1,1</text>
      <rect x="60" y="20" width="30" height="17" rx="3" fill="#0f172a" /><text x="75" y="32" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">1,2</text>
      <rect x="100" y="20" width="30" height="17" rx="3" fill="#0f172a" /><text x="115" y="32" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">1,3</text>
      <rect x="140" y="20" width="30" height="17" rx="3" fill="#0f172a" /><text x="155" y="32" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">1,4</text>
      <rect x="180" y="20" width="30" height="17" rx="3" fill="#0f172a" /><text x="195" y="32" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">1,5</text>
      <rect x="220" y="20" width="30" height="17" rx="3" fill="#d97706" /><text x="235" y="32" fill="#fff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">1,6</text>

      <!-- Row 2: d1=2 -->
      <text x="8" y="51" fill="#34d399" font-size="11" font-weight="bold" font-family="monospace">2</text>
      <rect x="20" y="39" width="30" height="17" rx="3" fill="#0f172a" /><text x="35" y="51" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">2,1</text>
      <rect x="60" y="39" width="30" height="17" rx="3" fill="#0f172a" /><text x="75" y="51" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">2,2</text>
      <rect x="100" y="39" width="30" height="17" rx="3" fill="#0f172a" /><text x="115" y="51" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">2,3</text>
      <rect x="140" y="39" width="30" height="17" rx="3" fill="#0f172a" /><text x="155" y="51" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">2,4</text>
      <rect x="180" y="39" width="30" height="17" rx="3" fill="#d97706" /><text x="195" y="51" fill="#fff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">2,5</text>
      <rect x="220" y="39" width="30" height="17" rx="3" fill="#0f172a" /><text x="235" y="51" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">2,6</text>

      <!-- Row 3: d1=3 -->
      <text x="8" y="70" fill="#34d399" font-size="11" font-weight="bold" font-family="monospace">3</text>
      <rect x="20" y="58" width="30" height="17" rx="3" fill="#0f172a" /><text x="35" y="70" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">3,1</text>
      <rect x="60" y="58" width="30" height="17" rx="3" fill="#0f172a" /><text x="75" y="70" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">3,2</text>
      <rect x="100" y="58" width="30" height="17" rx="3" fill="#0f172a" /><text x="115" y="70" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">3,3</text>
      <rect x="140" y="58" width="30" height="17" rx="3" fill="#d97706" /><text x="155" y="70" fill="#fff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">3,4</text>
      <rect x="180" y="58" width="30" height="17" rx="3" fill="#0f172a" /><text x="195" y="70" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">3,5</text>
      <rect x="220" y="58" width="30" height="17" rx="3" fill="#0f172a" /><text x="235" y="70" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">3,6</text>

      <!-- Row 4: d1=4 -->
      <text x="8" y="89" fill="#34d399" font-size="11" font-weight="bold" font-family="monospace">4</text>
      <rect x="20" y="77" width="30" height="17" rx="3" fill="#0f172a" /><text x="35" y="89" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">4,1</text>
      <rect x="60" y="77" width="30" height="17" rx="3" fill="#0f172a" /><text x="75" y="89" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">4,2</text>
      <rect x="100" y="77" width="30" height="17" rx="3" fill="#d97706" /><text x="115" y="89" fill="#fff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">4,3</text>
      <rect x="140" y="77" width="30" height="17" rx="3" fill="#0f172a" /><text x="155" y="89" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">4,4</text>
      <rect x="180" y="77" width="30" height="17" rx="3" fill="#0f172a" /><text x="195" y="89" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">4,5</text>
      <rect x="220" y="77" width="30" height="17" rx="3" fill="#0f172a" /><text x="235" y="89" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">4,6</text>

      <!-- Row 5: d1=5 -->
      <text x="8" y="108" fill="#34d399" font-size="11" font-weight="bold" font-family="monospace">5</text>
      <rect x="20" y="96" width="30" height="17" rx="3" fill="#0f172a" /><text x="35" y="108" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">5,1</text>
      <rect x="60" y="96" width="30" height="17" rx="3" fill="#d97706" /><text x="75" y="108" fill="#fff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">5,2</text>
      <rect x="100" y="96" width="30" height="17" rx="3" fill="#0f172a" /><text x="115" y="108" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">5,3</text>
      <rect x="140" y="96" width="30" height="17" rx="3" fill="#0f172a" /><text x="155" y="108" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">5,4</text>
      <rect x="180" y="96" width="30" height="17" rx="3" fill="#0f172a" /><text x="195" y="108" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">5,5</text>
      <rect x="220" y="96" width="30" height="17" rx="3" fill="#0f172a" /><text x="235" y="108" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">5,6</text>

      <!-- Row 6: d1=6 -->
      <text x="8" y="127" fill="#34d399" font-size="11" font-weight="bold" font-family="monospace">6</text>
      <rect x="20" y="115" width="30" height="17" rx="3" fill="#d97706" /><text x="35" y="127" fill="#fff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">6,1</text>
      <rect x="60" y="115" width="30" height="17" rx="3" fill="#0f172a" /><text x="75" y="127" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">6,2</text>
      <rect x="100" y="115" width="30" height="17" rx="3" fill="#0f172a" /><text x="115" y="127" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">6,3</text>
      <rect x="140" y="115" width="30" height="17" rx="3" fill="#0f172a" /><text x="155" y="127" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">6,4</text>
      <rect x="180" y="115" width="30" height="17" rx="3" fill="#0f172a" /><text x="195" y="127" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">6,5</text>
      <rect x="220" y="115" width="30" height="17" rx="3" fill="#0f172a" /><text x="235" y="127" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">6,6</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="20" y="180" width="310" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="175" y="196" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Each individual pair (d₁, d₂) has probability 1/36.</text>
    <text x="175" y="210" fill="#fbbf24" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Sum 7 has 6 pairs ⇒ P(Sum = 7) = 6/36 = 1/6.</text>
  </g>

  <!-- Right Panel: Probability Distribution Bar Chart -->
  <g transform="translate(415, 68)">
    <rect width="350" height="232" rx="10" fill="#182234" stroke="#fbbf24" stroke-dasharray="3 3" stroke-width="1" />
    <text x="175" y="24" fill="#fde68a" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Probability Distribution of Sums</text>
    <text x="175" y="42" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Sums range from 2 to 12 with non-uniform weights</text>

    <!-- Bar Chart Box -->
    <g transform="translate(20, 50)">
      <!-- Baseline -->
      <line x1="15" y1="108" x2="295" y2="108" stroke="#475569" stroke-width="1.5" />

      <!-- Bars: x starts at 22, spacing=25 -->
      <!-- 2: h=12 -->
      <rect x="20" y="96" width="16" height="12" rx="2" fill="#38bdf8" />
      <text x="28" y="122" fill="#cbd5e1" font-size="10" font-family="monospace" text-anchor="middle">2</text>
      <text x="28" y="92" fill="#94a3b8" font-size="8" font-family="monospace" text-anchor="middle">1</text>

      <!-- 3: h=24 -->
      <rect x="45" y="84" width="16" height="24" rx="2" fill="#38bdf8" />
      <text x="53" y="122" fill="#cbd5e1" font-size="10" font-family="monospace" text-anchor="middle">3</text>
      <text x="53" y="80" fill="#94a3b8" font-size="8" font-family="monospace" text-anchor="middle">2</text>

      <!-- 4: h=36 -->
      <rect x="70" y="72" width="16" height="36" rx="2" fill="#38bdf8" />
      <text x="78" y="122" fill="#cbd5e1" font-size="10" font-family="monospace" text-anchor="middle">4</text>
      <text x="78" y="68" fill="#94a3b8" font-size="8" font-family="monospace" text-anchor="middle">3</text>

      <!-- 5: h=48 -->
      <rect x="95" y="60" width="16" height="48" rx="2" fill="#38bdf8" />
      <text x="103" y="122" fill="#cbd5e1" font-size="10" font-family="monospace" text-anchor="middle">5</text>
      <text x="103" y="56" fill="#94a3b8" font-size="8" font-family="monospace" text-anchor="middle">4</text>

      <!-- 6: h=60 -->
      <rect x="120" y="48" width="16" height="60" rx="2" fill="#38bdf8" />
      <text x="128" y="122" fill="#cbd5e1" font-size="10" font-family="monospace" text-anchor="middle">6</text>
      <text x="128" y="44" fill="#94a3b8" font-size="8" font-family="monospace" text-anchor="middle">5</text>

      <!-- 7: h=74 (Peak) -->
      <rect x="145" y="34" width="20" height="74" rx="3" fill="#fbbf24" stroke="#fef08a" stroke-width="1" />
      <text x="155" y="122" fill="#fde68a" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">7</text>
      <text x="155" y="28" fill="#fbbf24" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">6/36</text>

      <!-- 8: h=60 -->
      <rect x="175" y="48" width="16" height="60" rx="2" fill="#38bdf8" />
      <text x="183" y="122" fill="#cbd5e1" font-size="10" font-family="monospace" text-anchor="middle">8</text>
      <text x="183" y="44" fill="#94a3b8" font-size="8" font-family="monospace" text-anchor="middle">5</text>

      <!-- 9: h=48 -->
      <rect x="200" y="60" width="16" height="48" rx="2" fill="#38bdf8" />
      <text x="208" y="122" fill="#cbd5e1" font-size="10" font-family="monospace" text-anchor="middle">9</text>
      <text x="208" y="56" fill="#94a3b8" font-size="8" font-family="monospace" text-anchor="middle">4</text>

      <!-- 10: h=36 -->
      <rect x="225" y="72" width="16" height="36" rx="2" fill="#38bdf8" />
      <text x="233" y="122" fill="#cbd5e1" font-size="10" font-family="monospace" text-anchor="middle">10</text>
      <text x="233" y="68" fill="#94a3b8" font-size="8" font-family="monospace" text-anchor="middle">3</text>

      <!-- 11: h=24 -->
      <rect x="250" y="84" width="16" height="24" rx="2" fill="#38bdf8" />
      <text x="258" y="122" fill="#cbd5e1" font-size="10" font-family="monospace" text-anchor="middle">11</text>
      <text x="258" y="80" fill="#94a3b8" font-size="8" font-family="monospace" text-anchor="middle">2</text>

      <!-- 12: h=12 -->
      <rect x="275" y="96" width="16" height="12" rx="2" fill="#38bdf8" />
      <text x="283" y="122" fill="#cbd5e1" font-size="10" font-family="monospace" text-anchor="middle">12</text>
      <text x="283" y="92" fill="#94a3b8" font-size="8" font-family="monospace" text-anchor="middle">1</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="20" y="180" width="310" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="175" y="196" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Sums form a triangular distribution: P(Sum) ≠ 1/11.</text>
    <text x="175" y="210" fill="#f87171" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Always count equally likely elementary pairs, not totals!</text>
  </g>
</svg>
