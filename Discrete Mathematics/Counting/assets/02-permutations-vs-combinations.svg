<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Linear Gradients -->
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Marker -->
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="320" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />

  <!-- Header Title & Subtitle -->
  <text x="400" y="32" fill="#f8fafc" font-size="18" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Permutations vs. Combinations &amp; Symmetry</text>
  <text x="400" y="52" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Order matters (sequences) vs. Order ignored (sets) • Rotational &amp; Reflection symmetry</text>

  <!-- Left Panel: Permutations vs. Combinations -->
  <g transform="translate(35, 68)">
    <rect width="350" height="232" rx="10" fill="#182234" stroke="#2563eb" stroke-dasharray="3 3" stroke-width="1" />
    <text x="175" y="24" fill="#93c5fd" font-size="14" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Permutations vs. Combinations</text>
    <text x="175" y="42" fill="#38bdf8" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Select 3 items from {A, B, C}</text>

    <!-- Sub-box 1: Permutations -->
    <g transform="translate(18, 55)">
      <rect width="130" height="112" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1" />
      <text x="65" y="20" fill="#93c5fd" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Permutations P(n, r)</text>
      <text x="25" y="42" fill="#f8fafc" font-size="11" font-family="monospace">1. ABC</text>
      <text x="75" y="42" fill="#f8fafc" font-size="11" font-family="monospace">4. BCA</text>
      <text x="25" y="62" fill="#f8fafc" font-size="11" font-family="monospace">2. ACB</text>
      <text x="75" y="62" fill="#f8fafc" font-size="11" font-family="monospace">5. CAB</text>
      <text x="25" y="82" fill="#f8fafc" font-size="11" font-family="monospace">3. BAC</text>
      <text x="75" y="82" fill="#f8fafc" font-size="11" font-family="monospace">6. CBA</text>
      <rect x="15" y="90" width="100" height="16" rx="3" fill="#1e293b" />
      <text x="65" y="102" fill="#38bdf8" font-size="10" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3! = 6 Lists</text>
    </g>

    <!-- Middle Arrow -->
    <g transform="translate(155, 110)">
      <line x1="0" y1="0" x2="32" y2="0" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)" />
      <text x="16" y="-8" fill="#fbbf24" font-size="10" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">÷ 3!</text>
      <text x="16" y="18" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Collapse</text>
    </g>

    <!-- Sub-box 2: Combinations -->
    <g transform="translate(198, 55)">
      <rect width="134" height="112" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1" />
      <text x="67" y="20" fill="#a7f3d0" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Combinations C(n, r)</text>
      
      <circle cx="67" cy="58" r="28" fill="#059669" fill-opacity="0.25" stroke="#34d399" stroke-width="1.8" />
      <text x="67" y="62" fill="#f8fafc" font-size="13" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">{A, B, C}</text>

      <rect x="15" y="90" width="104" height="16" rx="3" fill="#1e293b" />
      <text x="67" y="102" fill="#34d399" font-size="10" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1 Unordered Set</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="20" y="180" width="310" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="175" y="196" fill="#cbd5e1" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Division Rule: C(n, r) = P(n, r) / r!</text>
    <text x="175" y="210" fill="#38bdf8" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Divides away the r! duplicate internal orders.</text>
  </g>

  <!-- Right Panel: Circular Permutations & Necklaces -->
  <g transform="translate(415, 68)">
    <rect width="350" height="232" rx="10" fill="#182234" stroke="#c084fc" stroke-dasharray="3 3" stroke-width="1" />
    <text x="175" y="24" fill="#e9d5ff" font-size="14" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Circular Permutations &amp; Reflection</text>
    <text x="175" y="42" fill="#c084fc" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Table Seating vs. Keychain / Necklace</text>

    <!-- Top Card: Round Table -->
    <g transform="translate(20, 55)">
      <rect width="310" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <!-- Mini circular graphic -->
      <circle cx="32" cy="26" r="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />
      <circle cx="32" cy="10" r="3.5" fill="#38bdf8" />
      <circle cx="48" cy="26" r="3.5" fill="#38bdf8" />
      <circle cx="32" cy="42" r="3.5" fill="#38bdf8" />
      <circle cx="16" cy="26" r="3.5" fill="#38bdf8" />

      <text x="60" y="22" fill="#38bdf8" font-size="12" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Round Table (Seating):</text>
      <text x="215" y="22" fill="#ffffff" font-size="12" font-weight="bold" font-family="monospace">Total = (n − 1)!</text>
      <text x="60" y="40" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Rotations identical; clockwise ≠ counter-clockwise.</text>
    </g>

    <!-- Bottom Card: Necklace / Keychain -->
    <g transform="translate(20, 118)">
      <rect width="310" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <!-- Mini necklace with flip arrow -->
      <circle cx="32" cy="26" r="16" fill="none" stroke="#fb7185" stroke-width="1.5" />
      <circle cx="32" cy="10" r="3.5" fill="#fb7185" />
      <circle cx="48" cy="26" r="3.5" fill="#fbbf24" />
      <circle cx="32" cy="42" r="3.5" fill="#34d399" />
      <circle cx="16" cy="26" r="3.5" fill="#38bdf8" />

      <text x="60" y="22" fill="#fb7185" font-size="12" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Necklace / Keychain:</text>
      <text x="205" y="22" fill="#ffffff" font-size="12" font-weight="bold" font-family="monospace">Total = (n − 1)! / 2</text>
      <text x="60" y="40" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Flipping in 3D space makes mirror images identical.</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="20" y="180" width="310" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="175" y="196" fill="#cbd5e1" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Physical reflection adds an extra 2-to-1 symmetry.</text>
    <text x="175" y="210" fill="#c084fc" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Always check if the object can be flipped over in 3D!</text>
  </g>
</svg>
