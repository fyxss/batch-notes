<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Linear Gradients -->
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="320" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />

  <!-- Header Title & Subtitle -->
  <text x="400" y="32" fill="#f8fafc" font-size="18" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Stars &amp; Bars (Repetition) &amp; Lattice Grid-Walks</text>
  <text x="400" y="52" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Mapping multi-category selection and coordinate paths to binary sequence choices</text>

  <!-- Left Panel: Stars & Bars -->
  <g transform="translate(35, 68)">
    <rect width="350" height="232" rx="10" fill="#182234" stroke="#fbbf24" stroke-dasharray="3 3" stroke-width="1" />
    <text x="175" y="24" fill="#fde68a" font-size="14" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Stars &amp; Bars: x₁ + x₂ + x₃ = 6</text>
    <text x="175" y="42" fill="#fbbf24" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">C(n + r − 1, r) = C(3 + 6 − 1, 6) = C(8, 6) = 28</text>

    <!-- Visual Token Display -->
    <g transform="translate(20, 55)">
      <rect width="310" height="112" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />

      <!-- Bin 1: 2 stars -->
      <circle cx="38" cy="45" r="10" fill="url(#grad-amber)" stroke="#fff" stroke-width="1.2" filter="url(#shadow)" />
      <circle cx="64" cy="45" r="10" fill="url(#grad-amber)" stroke="#fff" stroke-width="1.2" filter="url(#shadow)" />
      <text x="51" y="75" fill="#38bdf8" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">x₁ = 2</text>

      <!-- Bar 1 -->
      <line x1="92" y1="20" x2="92" y2="70" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />

      <!-- Bin 2: 3 stars -->
      <circle cx="120" cy="45" r="10" fill="url(#grad-amber)" stroke="#fff" stroke-width="1.2" filter="url(#shadow)" />
      <circle cx="146" cy="45" r="10" fill="url(#grad-amber)" stroke="#fff" stroke-width="1.2" filter="url(#shadow)" />
      <circle cx="172" cy="45" r="10" fill="url(#grad-amber)" stroke="#fff" stroke-width="1.2" filter="url(#shadow)" />
      <text x="146" y="75" fill="#38bdf8" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">x₂ = 3</text>

      <!-- Bar 2 -->
      <line x1="200" y1="20" x2="200" y2="70" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />

      <!-- Bin 3: 1 star -->
      <circle cx="228" cy="45" r="10" fill="url(#grad-amber)" stroke="#fff" stroke-width="1.2" filter="url(#shadow)" />
      <text x="228" y="75" fill="#38bdf8" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">x₃ = 1</text>

      <!-- Summary text inside box -->
      <text x="155" y="98" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">6 identical items (stars) + 2 separators (bars) = 8 slots</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="20" y="180" width="310" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="175" y="196" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Choose 2 bar positions among 8 total slots: C(8, 2)</text>
    <text x="175" y="210" fill="#fde68a" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Non-negative integers: zeros permitted (adjacent bars).</text>
  </g>

  <!-- Right Panel: Lattice Grid-Walk -->
  <g transform="translate(415, 68)">
    <rect width="350" height="232" rx="10" fill="#182234" stroke="#34d399" stroke-dasharray="3 3" stroke-width="1" />
    <text x="175" y="24" fill="#a7f3d0" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Lattice Grid-Walk: (0,0) → (3,2)</text>
    <text x="175" y="42" fill="#34d399" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">m Right, n Up ⇒ C(m + n, m) = C(5, 3) = 10 paths</text>

    <!-- Grid Box -->
    <g transform="translate(20, 55)">
      <rect width="310" height="112" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />

      <!-- Coordinate Grid (3 wide, 2 high) -->
      <!-- Origin at x=45, y=85. Each cell is 60px wide, 32px high -->
      <!-- Horizontal lines -->
      <line x1="45" y1="85" x2="225" y2="85" stroke="#334155" stroke-width="1.5" />
      <line x1="45" y1="53" x2="225" y2="53" stroke="#334155" stroke-width="1.5" />
      <line x1="45" y1="21" x2="225" y2="21" stroke="#334155" stroke-width="1.5" />

      <!-- Vertical lines -->
      <line x1="45" y1="21" x2="45" y2="85" stroke="#334155" stroke-width="1.5" />
      <line x1="105" y1="21" x2="105" y2="85" stroke="#334155" stroke-width="1.5" />
      <line x1="165" y1="21" x2="165" y2="85" stroke="#334155" stroke-width="1.5" />
      <line x1="225" y1="21" x2="225" y2="85" stroke="#334155" stroke-width="1.5" />

      <!-- Highlighted Path: (0,0)->(1,0)->(2,0)->(2,1)->(3,1)->(3,2) [R, R, U, R, U] -->
      <polyline points="45,85 105,85 165,85 165,53 225,53 225,21" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Intermediate Path Step Dots -->
      <circle cx="105" cy="85" r="3.5" fill="#34d399" />
      <circle cx="165" cy="85" r="3.5" fill="#34d399" />
      <circle cx="165" cy="53" r="3.5" fill="#34d399" />
      <circle cx="225" cy="53" r="3.5" fill="#34d399" />

      <!-- Start Node (0,0) -->
      <circle cx="45" cy="85" r="6" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
      <text x="45" y="103" fill="#38bdf8" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">(0,0)</text>

      <!-- Destination Node (3,2) -->
      <circle cx="225" cy="21" r="6" fill="url(#grad-rose)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
      <text x="225" y="14" fill="#fb7185" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">(3,2)</text>

      <!-- Path String Callout -->
      <rect x="238" y="44" width="62" height="24" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="269" y="60" fill="#a7f3d0" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">R R U R U</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="20" y="180" width="310" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="175" y="196" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Multiset permutation: 5! / (3! 2!) = 10 paths</text>
    <text x="175" y="210" fill="#34d399" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Equivalent to choosing the 3 Right steps out of 5 total.</text>
  </g>
</svg>
