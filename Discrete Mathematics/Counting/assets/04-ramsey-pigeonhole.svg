<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Linear Gradients -->
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="320" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />

  <!-- Header Title & Subtitle -->
  <text x="400" y="32" fill="#f8fafc" font-size="18" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Ramsey Theory R(3,3) = 6 &amp; The 5-Person Counterexample</text>
  <text x="400" y="52" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Theorem on Friends and Strangers: Complete order forced in N ≥ 6, avoidable in N = 5</text>

  <!-- Left Panel: 6 People -->
  <g transform="translate(35, 68)">
    <rect width="350" height="232" rx="10" fill="#182234" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="1" />
    <text x="175" y="24" fill="#93c5fd" font-size="14" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">6 People: Triangle Forced (R(3,3) ≤ 6)</text>
    <text x="175" y="42" fill="#38bdf8" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">PHP: 5 edges from A ⇒ ⌈5/2⌉ = 3 of same type</text>

    <!-- Graph Visual Box -->
    <g transform="translate(20, 50)">
      <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />

      <!-- Vertex A (Center Left) -->
      <circle cx="50" cy="55" r="14" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
      <text x="50" y="60" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">A</text>

      <!-- 3 Blue edges from A to B, C, D -->
      <line x1="50" y1="55" x2="165" y2="20" stroke="#38bdf8" stroke-width="2.5" />
      <line x1="50" y1="55" x2="195" y2="55" stroke="#38bdf8" stroke-width="2.5" />
      <line x1="50" y1="55" x2="165" y2="90" stroke="#38bdf8" stroke-width="2.5" />

      <!-- Vertices B, C, D -->
      <circle cx="165" cy="20" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="165" y="24" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">B</text>

      <circle cx="195" cy="55" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="195" y="59" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">C</text>

      <circle cx="165" cy="90" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="165" y="94" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">D</text>

      <!-- Sub-connections between B, C, D -->
      <line x1="165" y1="20" x2="195" y2="55" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 2" />
      <text x="250" y="32" fill="#38bdf8" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">If Blue: Δ ABC</text>

      <line x1="165" y1="20" x2="165" y2="90" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 2" />
      <line x1="195" y1="55" x2="165" y2="90" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 2" />
      <text x="250" y="78" fill="#f43f5e" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">If Red: Δ BCD</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="20" y="180" width="310" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="175" y="196" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">If ANY edge in {B,C,D} is Blue ⇒ Blue triangle with A.</text>
    <text x="175" y="210" fill="#f87171" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">If NO edge is Blue ⇒ {B,C,D} form a Red triangle!</text>
  </g>

  <!-- Right Panel: 5 People Counterexample -->
  <g transform="translate(415, 68)">
    <rect width="350" height="232" rx="10" fill="#182234" stroke="#fbbf24" stroke-dasharray="3 3" stroke-width="1" />
    <text x="175" y="24" fill="#fde68a" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">5 People: No Triangle Possible! (R(3,3) &gt; 5)</text>
    <text x="175" y="42" fill="#fbbf24" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Outer Cycle C₅ (Friends) • Inner Star (Enemies)</text>

    <!-- Pentagon Graphic Box -->
    <g transform="translate(20, 50)">
      <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />

      <!-- Regular Pentagon centered at x=155, y=60, radius=46 -->
      <!-- P0: (155, 14)
           P1: (199, 46)
           P2: (182, 97)
           P3: (128, 97)
           P4: (111, 46) -->

      <!-- Outer cycle edges (Blue) -->
      <polygon points="155,14 199,46 182,97 128,97 111,46" fill="none" stroke="#38bdf8" stroke-width="2.5" />

      <!-- Inner chords forming star (Red) -->
      <line x1="155" y1="14" x2="182" y2="97" stroke="#f43f5e" stroke-width="2" />
      <line x1="155" y1="14" x2="128" y2="97" stroke="#f43f5e" stroke-width="2" />
      <line x1="199" y1="46" x2="128" y2="97" stroke="#f43f5e" stroke-width="2" />
      <line x1="199" y1="46" x2="111" y2="46" stroke="#f43f5e" stroke-width="2" />
      <line x1="182" y1="97" x2="111" y2="46" stroke="#f43f5e" stroke-width="2" />

      <!-- Vertex Circles -->
      <circle cx="155" cy="14" r="7" fill="#1e293b" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="199" cy="46" r="7" fill="#1e293b" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="182" cy="97" r="7" fill="#1e293b" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="128" cy="97" r="7" fill="#1e293b" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="111" cy="46" r="7" fill="#1e293b" stroke="#ffffff" stroke-width="1.5" />

      <!-- Legend -->
      <rect x="230" y="25" width="70" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" />
      <text x="265" y="39" fill="#38bdf8" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Cycle C₅</text>

      <rect x="230" y="55" width="70" height="22" rx="4" fill="#1e293b" stroke="#f43f5e" />
      <text x="265" y="69" fill="#f43f5e" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Star (C₅)</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="20" y="180" width="310" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="175" y="196" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Cycle C₅ has only 5-cycles (no 3-cycles in blue or red).</text>
    <text x="175" y="210" fill="#fde68a" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Combined with 6-person proof ⇒ R(3,3) = 6 exactly!</text>
  </g>
</svg>
