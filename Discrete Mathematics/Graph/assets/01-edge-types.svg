<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="100%" height="100%">

  <defs>
    <!-- Linear Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="760" height="260" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Section 1: Undirected Edge -->
  <g transform="translate(40, 20)">
    <rect width="320" height="220" rx="10" fill="#182234" stroke="#2563eb" stroke-dasharray="3 3" stroke-width="1" />
    <text x="160" y="32" fill="#93c5fd" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Undirected Edge {u, v}</text>
    <text x="160" y="52" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Unordered Pair: {u, v} = {v, u}</text>
    
    <!-- Edge line -->
    <line x1="70" y1="120" x2="250" y2="120" stroke="#38bdf8" stroke-width="3" />
    
    <!-- Node u -->
    <circle cx="70" cy="120" r="22" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="70" y="125" fill="#ffffff" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">u</text>
    
    <!-- Node v -->
    <circle cx="250" cy="120" r="22" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="250" y="125" fill="#ffffff" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">v</text>
    
    <!-- Badge explanation -->
    <rect x="35" y="170" width="250" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="160" y="188" fill="#38bdf8" font-size="12" font-weight="500" font-family="system-ui, sans-serif" text-anchor="middle">Symmetric • Two-Way Traversal</text>
  </g>

  <!-- Section 2: Directed Edge -->
  <g transform="translate(400, 20)">
    <rect width="320" height="220" rx="10" fill="#182234" stroke="#7c3aed" stroke-dasharray="3 3" stroke-width="1" />
    <text x="160" y="32" fill="#c084fc" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Directed Edge (u, v)</text>
    <text x="160" y="52" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Ordered Pair: (u, v) ≠ (v, u)</text>
    
    <!-- Directed Arc -->
    <line x1="72" y1="120" x2="225" y2="120" stroke="#c084fc" stroke-width="3" marker-end="url(#arrow-purple)" />
    
    <!-- Node u -->
    <circle cx="70" cy="120" r="22" fill="url(#grad-purple)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="70" y="125" fill="#ffffff" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">u</text>
    <text x="70" y="156" fill="#a78bfa" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Initial</text>
    
    <!-- Node v -->
    <circle cx="250" cy="120" r="22" fill="url(#grad-purple)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="250" y="125" fill="#ffffff" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">v</text>
    <text x="250" y="156" fill="#a78bfa" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Terminal</text>
    
    <!-- Badge explanation -->
    <rect x="35" y="170" width="250" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="160" y="188" fill="#c084fc" font-size="12" font-weight="500" font-family="system-ui, sans-serif" text-anchor="middle">Asymmetric • One-Way Arc</text>
  </g>
</svg>