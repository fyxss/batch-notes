<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">

  <defs>
    <!-- Linear Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="320" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Header Title -->
  <text x="400" y="34" fill="#f8fafc" font-size="18" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Classification of Graph Families</text>
  <text x="400" y="54" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">Rosen Chapter 10 taxonomy based on edge types, multiplicity, and self-loops</text>
  
  <!-- Root Node -->
  <rect x="320" y="75" width="160" height="38" rx="8" fill="url(#grad-blue)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)" />
  <text x="400" y="99" fill="#ffffff" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Graph G = (V, E)</text>
  
  <!-- Connecting lines -->
  <path d="M 360 113 L 360 135 L 200 135 L 200 150" stroke="#64748b" stroke-width="2" fill="none" />
  <path d="M 440 113 L 440 135 L 600 135 L 600 150" stroke="#64748b" stroke-width="2" fill="none" />
  
  <!-- Left Branch: Undirected -->
  <rect x="100" y="150" width="200" height="34" rx="8" fill="url(#grad-emerald)" stroke="#4ade80" stroke-width="1.5" filter="url(#shadow)" />
  <text x="200" y="172" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Undirected Graphs</text>
  
  <!-- Undirected Children -->
  <g transform="translate(40, 200)">
    <!-- Simple Graph -->
    <rect x="0" y="0" width="100" height="95" rx="8" fill="#182234" stroke="#334155" stroke-width="1.2" />
    <text x="50" y="24" fill="#38bdf8" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Simple</text>
    <text x="50" y="44" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">No Loops</text>
    <text x="50" y="58" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">No Multi-edges</text>
    <circle cx="35" cy="78" r="4" fill="#38bdf8" /><circle cx="65" cy="78" r="4" fill="#38bdf8" /><line x1="35" y1="78" x2="65" y2="78" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Multigraph -->
    <rect x="110" y="0" width="100" height="95" rx="8" fill="#182234" stroke="#334155" stroke-width="1.2" />
    <text x="160" y="24" fill="#fbbf24" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Multigraph</text>
    <text x="160" y="44" fill="#fde047" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Parallel Edges</text>
    <text x="160" y="58" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">No Loops</text>
    <circle cx="145" cy="78" r="4" fill="#fbbf24" /><circle cx="175" cy="78" r="4" fill="#fbbf24" />
    <path d="M 145 78 Q 160 70 175 78" stroke="#fbbf24" stroke-width="1.5" fill="none" />
    <path d="M 145 78 Q 160 86 175 78" stroke="#fbbf24" stroke-width="1.5" fill="none" />
    
    <!-- Pseudograph -->
    <rect x="220" y="0" width="100" height="95" rx="8" fill="#182234" stroke="#334155" stroke-width="1.2" />
    <text x="270" y="24" fill="#f43f5e" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Pseudograph</text>
    <text x="270" y="44" fill="#fda4af" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Parallel Edges</text>
    <text x="270" y="58" fill="#fda4af" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">+ Self-Loops</text>
    <circle cx="260" cy="78" r="4" fill="#f43f5e" /><circle cx="285" cy="78" r="4" fill="#f43f5e" /><line x1="260" y1="78" x2="285" y2="78" stroke="#f43f5e" stroke-width="1.5" />
    <path d="M 260 78 C 245 65 245 91 260 78" stroke="#f43f5e" stroke-width="1.5" fill="none" />
  </g>

  <!-- Right Branch: Directed -->
  <rect x="500" y="150" width="200" height="34" rx="8" fill="url(#grad-purple)" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)" />
  <text x="600" y="172" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Directed Graphs (Digraphs)</text>
  
  <!-- Directed Children -->
  <g transform="translate(440, 200)">
    <!-- Simple Directed -->
    <rect x="0" y="0" width="100" height="95" rx="8" fill="#182234" stroke="#334155" stroke-width="1.2" />
    <text x="50" y="24" fill="#a78bfa" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Simple Directed</text>
    <text x="50" y="44" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">No Loops</text>
    <text x="50" y="58" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">No Multi-arcs</text>
    <circle cx="35" cy="78" r="4" fill="#a78bfa" /><circle cx="65" cy="78" r="4" fill="#a78bfa" /><line x1="35" y1="78" x2="60" y2="78" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-purple)" />
    
    <!-- Directed Multigraph -->
    <rect x="110" y="0" width="100" height="95" rx="8" fill="#182234" stroke="#334155" stroke-width="1.2" />
    <text x="160" y="24" fill="#38bdf8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Dir. Multigraph</text>
    <text x="160" y="44" fill="#7dd3fc" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Parallel Arcs</text>
    <text x="160" y="58" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">(u, v) Multiples</text>
    <circle cx="145" cy="78" r="4" fill="#38bdf8" /><circle cx="175" cy="78" r="4" fill="#38bdf8" />
    <path d="M 145 75 Q 160 67 170 75" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <path d="M 145 81 Q 160 89 170 81" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

    <!-- Mixed Graph -->
    <rect x="220" y="0" width="100" height="95" rx="8" fill="#182234" stroke="#334155" stroke-width="1.2" />
    <text x="270" y="24" fill="#34d399" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Mixed Graph</text>
    <text x="270" y="44" fill="#6ee7b7" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Directed Arcs</text>
    <text x="270" y="58" fill="#6ee7b7" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">+ Undir. Edges</text>
    <circle cx="255" cy="78" r="4" fill="#34d399" /><circle cx="285" cy="78" r="4" fill="#34d399" />
    <line x1="255" y1="75" x2="285" y2="75" stroke="#34d399" stroke-width="1.5" />
    <path d="M 255 82 L 280 82" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)" />
  </g>
</svg>