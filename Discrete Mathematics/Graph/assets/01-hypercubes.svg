<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" width="100%" height="100%">

  <defs>
    <!-- Linear Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="780" height="270" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  
  <text x="390" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Hypercube Graphs (Qₙ)</text>
  <text x="390" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Vertices are bitstrings of length n; edge exists if bitstrings differ by exactly 1 bit. Total vertices: 2ⁿ, Edges: n·2ⁿ⁻¹</text>

  <!-- Q1 -->
  <g transform="translate(30, 65)">
    <rect width="180" height="185" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />
    <text x="90" y="25" fill="#38bdf8" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Q₁ (1-Cube)</text>
    <text x="90" y="42" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">2¹ = 2 vertices, 1 edge</text>
    
    <line x1="45" y1="105" x2="135" y2="105" stroke="#38bdf8" stroke-width="3" />
    <circle cx="45" cy="105" r="16" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
    <text x="45" y="110" fill="#ffffff" font-size="13" font-weight="bold" font-family="monospace" text-anchor="middle">0</text>
    
    <circle cx="135" cy="105" r="16" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
    <text x="135" y="110" fill="#ffffff" font-size="13" font-weight="bold" font-family="monospace" text-anchor="middle">1</text>
    <text x="90" y="162" fill="#64748b" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Line Segment</text>
  </g>

  <!-- Q2 -->
  <g transform="translate(240, 65)">
    <rect width="210" height="185" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />
    <text x="105" y="25" fill="#34d399" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Q₂ (2-Cube / C₄)</text>
    <text x="105" y="42" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">2² = 4 vertices, 4 edges</text>
    
    <!-- Square edges -->
    <rect x="45" y="70" width="120" height="70" stroke="#34d399" stroke-width="2.5" fill="none" />
    
    <!-- 4 vertices (Gray code cycle: 00 -> 01 -> 11 -> 10 -> 00) -->
    <circle cx="45" cy="70" r="16" fill="url(#grad-emerald)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
    <text x="45" y="75" fill="#ffffff" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">00</text>
    
    <circle cx="165" cy="70" r="16" fill="url(#grad-emerald)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
    <text x="165" y="75" fill="#ffffff" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">01</text>
    
    <circle cx="45" cy="140" r="16" fill="url(#grad-emerald)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
    <text x="45" y="145" fill="#ffffff" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">10</text>
    
    <circle cx="165" cy="140" r="16" fill="url(#grad-emerald)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
    <text x="165" y="145" fill="#ffffff" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">11</text>
    <text x="105" y="168" fill="#64748b" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Square / 4-Cycle</text>
  </g>

  <!-- Q3 -->
  <g transform="translate(480, 65)">
    <rect width="270" height="185" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />
    <text x="135" y="25" fill="#c084fc" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Q₃ (3-Cube)</text>
    <text x="135" y="42" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">2³ = 8 vertices, 12 edges</text>
    
    <!-- 3D Perspective Projection: Front face (solid) lower-left, Back face (dashed) upper-right -->
    <!-- Connecting struts between corresponding vertices -->
    <line x1="45" y1="85" x2="85" y2="60" stroke="#a78bfa" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="145" y1="85" x2="185" y2="60" stroke="#a78bfa" stroke-width="2" />
    <line x1="45" y1="145" x2="85" y2="120" stroke="#a78bfa" stroke-width="2" />
    <line x1="145" y1="145" x2="185" y2="120" stroke="#a78bfa" stroke-width="2" />
    
    <!-- Back face (upper-right) -->
    <rect x="85" y="60" width="100" height="60" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="3 3" />
    <!-- Front face (lower-left) -->
    <rect x="45" y="85" width="100" height="60" stroke="#c084fc" stroke-width="2" fill="none" />
    
    <!-- Back Vertices -->
    <circle cx="85" cy="60" r="12" fill="#6d28d9" stroke="#ffffff" stroke-width="1" />
    <text x="85" y="64" fill="#ffffff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">001</text>
    
    <circle cx="185" cy="60" r="12" fill="#6d28d9" stroke="#ffffff" stroke-width="1" />
    <text x="185" y="64" fill="#ffffff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">011</text>
    
    <circle cx="85" cy="120" r="12" fill="#6d28d9" stroke="#ffffff" stroke-width="1" />
    <text x="85" y="124" fill="#ffffff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">101</text>
    
    <circle cx="185" cy="120" r="12" fill="#6d28d9" stroke="#ffffff" stroke-width="1" />
    <text x="185" y="124" fill="#ffffff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">111</text>
    
    <!-- Front Vertices -->
    <circle cx="45" cy="85" r="12" fill="url(#grad-purple)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
    <text x="45" y="89" fill="#ffffff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">000</text>
    
    <circle cx="145" cy="85" r="12" fill="url(#grad-purple)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
    <text x="145" y="89" fill="#ffffff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">010</text>
    
    <circle cx="45" cy="145" r="12" fill="url(#grad-purple)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
    <text x="45" y="149" fill="#ffffff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">100</text>
    
    <circle cx="145" cy="145" r="12" fill="url(#grad-purple)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
    <text x="145" y="149" fill="#ffffff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">110</text>
    
    <text x="135" y="172" fill="#a78bfa" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">3D Cube (Bipartite &amp; Hamiltonian)</text>
  </g>
</svg>