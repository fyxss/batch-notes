<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="760" height="270" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="380" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Bipartite Graph Representation: G = (V₁ ∪ V₂, E)</text>
  <text x="380" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Every edge joins a vertex in V₁ to a vertex in V₂. No internal edges exist within V₁ or within V₂.</text>

  <!-- Central Header Badge (above cross edges) -->
  <rect x="285" y="62" width="190" height="24" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" />
  <text x="380" y="78" fill="#fbbf24" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Cross-Partition Edges Only</text>

  <!-- Cross-partition Edges (connecting V1 to V2) -->
  <!-- v1(150, 100) -> u1(610, 100), u2(610, 145) -->
  <line x1="150" y1="100" x2="610" y2="100" stroke="#fbbf24" stroke-width="2.5" stroke-opacity="0.9" />
  <line x1="150" y1="100" x2="610" y2="145" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.8" />

  <!-- v2(150, 145) -> u1(610, 100), u3(610, 190) -->
  <line x1="150" y1="145" x2="610" y2="100" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.8" />
  <line x1="150" y1="145" x2="610" y2="190" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.8" />

  <!-- v3(150, 190) -> u2(610, 145), u3(610, 190) -->
  <line x1="150" y1="190" x2="610" y2="145" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.8" />
  <line x1="150" y1="190" x2="610" y2="190" stroke="#fbbf24" stroke-width="2.5" stroke-opacity="0.9" />

  <!-- Partition V1 Column Container (Left) -->
  <g transform="translate(50, 60)">
    <rect width="190" height="165" rx="10" fill="#182234" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1.5" fill-opacity="0.85" />
    <text x="95" y="22" fill="#38bdf8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Partition V₁</text>
    <text x="95" y="35" fill="#64748b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Independent Set (Color 1)</text>
    
    <!-- Forbidden internal edge indicator -->
    <path d="M 38 85 L 38 130" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="2 3" />
    <text x="34" y="111" fill="#fb7185" font-size="11" font-weight="bold" text-anchor="end">✗</text>

    <!-- Vertices v1, v2, v3 -->
    <circle cx="100" cy="40" r="16" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="100" y="45" fill="#ffffff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">v₁</text>

    <circle cx="100" cy="85" r="16" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="100" y="90" fill="#ffffff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">v₂</text>

    <circle cx="100" cy="130" r="16" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="100" y="135" fill="#ffffff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">v₃</text>
  </g>

  <!-- Partition V2 Column Container (Right) -->
  <g transform="translate(520, 60)">
    <rect width="190" height="165" rx="10" fill="#182234" stroke="#fb7185" stroke-dasharray="4 4" stroke-width="1.5" fill-opacity="0.85" />
    <text x="95" y="22" fill="#fb7185" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Partition V₂</text>
    <text x="95" y="35" fill="#64748b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Independent Set (Color 2)</text>

    <!-- Forbidden internal edge indicator -->
    <path d="M 152 85 L 152 130" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="2 3" />
    <text x="156" y="111" fill="#fb7185" font-size="11" font-weight="bold" text-anchor="start">✗</text>

    <!-- Vertices u1, u2, u3 -->
    <circle cx="90" cy="40" r="16" fill="url(#grad-rose)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="90" y="45" fill="#ffffff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">u₁</text>

    <circle cx="90" cy="85" r="16" fill="url(#grad-rose)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="90" y="90" fill="#ffffff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">u₂</text>

    <circle cx="90" cy="130" r="16" fill="url(#grad-rose)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="90" y="135" fill="#ffffff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">u₃</text>
  </g>

  <!-- Bottom Proof / Theorem Pill -->
  <rect x="160" y="236" width="440" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="380" y="252" fill="#34d399" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Theorem: 2-Colorable ⟺ Contains No Odd Cycles</text>
</svg>