<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-darknode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="760" height="260" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="380" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Course Conflict Graph &amp; Final Exam Scheduling</text>
  <text x="380" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Edge denotes shared student enrollment (cannot schedule simultaneously). Chromatic number χ(G) = 3.</text>

  <!-- Left: Conflict Graph -->
  <g transform="translate(40, 65)">
    <rect width="320" height="175" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />
    <text x="160" y="24" fill="#f8fafc" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Conflict Graph G</text>
    
    <!-- Edges: Math-Physics, Math-CS, Physics-Art, CS-Art -->
    <line x1="160" y1="50" x2="70" y2="105" stroke="#94a3b8" stroke-width="2" />
    <line x1="160" y1="50" x2="250" y2="105" stroke="#94a3b8" stroke-width="2" />
    <line x1="70" y1="105" x2="160" y2="150" stroke="#94a3b8" stroke-width="2" />
    <line x1="250" y1="105" x2="160" y2="150" stroke="#94a3b8" stroke-width="2" />
    <line x1="70" y1="105" x2="250" y2="105" stroke="#94a3b8" stroke-width="2" />

    <!-- Nodes with proper colors -->
    <!-- Math (Red) -->
    <circle cx="160" cy="50" r="17" fill="url(#grad-rose)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="160" y="55" fill="#ffffff" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Math</text>
    
    <!-- Physics (Blue) -->
    <circle cx="70" cy="105" r="17" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="70" y="110" fill="#ffffff" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Physics</text>

    <!-- CS (Green) -->
    <circle cx="250" cy="105" r="17" fill="url(#grad-emerald)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="250" y="110" fill="#ffffff" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">CS</text>

    <!-- Art (Red) -->
    <circle cx="160" cy="150" r="17" fill="url(#grad-rose)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="160" y="155" fill="#ffffff" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Art</text>
  </g>

  <!-- Right: Schedule Slots -->
  <g transform="translate(400, 65)">
    <rect width="320" height="175" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />
    <text x="160" y="24" fill="#f8fafc" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Optimal 3-Slot Exam Schedule</text>
    
    <!-- Slot 1 -->
    <rect x="20" y="40" width="280" height="34" rx="6" fill="#1e293b" stroke="#e11d48" stroke-width="1.5" />
    <circle cx="40" cy="57" r="8" fill="url(#grad-rose)" />
    <text x="55" y="61" fill="#fb7185" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">Slot 1 (Red):</text>
    <text x="150" y="61" fill="#f8fafc" font-size="12" font-family="system-ui, sans-serif">Math, Art (Independent)</text>
    
    <!-- Slot 2 -->
    <rect x="20" y="82" width="280" height="34" rx="6" fill="#1e293b" stroke="#2563eb" stroke-width="1.5" />
    <circle cx="40" cy="99" r="8" fill="url(#grad-blue)" />
    <text x="55" y="103" fill="#60a5fa" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">Slot 2 (Blue):</text>
    <text x="150" y="103" fill="#f8fafc" font-size="12" font-family="system-ui, sans-serif">Physics</text>

    <!-- Slot 3 -->
    <rect x="20" y="124" width="280" height="34" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1.5" />
    <circle cx="40" cy="141" r="8" fill="url(#grad-emerald)" />
    <text x="55" y="145" fill="#34d399" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">Slot 3 (Green):</text>
    <text x="150" y="145" fill="#f8fafc" font-size="12" font-family="system-ui, sans-serif">CS</text>
  </g>
</svg>