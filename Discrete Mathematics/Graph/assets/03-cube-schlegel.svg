<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-darknode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="760" height="270" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="380" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">3D Cube (Q₃): Perspective Drawing vs. Planar Schlegel Diagram</text>
  <text x="380" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">The 3-cube is 3-regular and planar. It embeds into the plane with 6 faces (Euler: 8 - 12 + 6 = 2).</text>

  <!-- Left: 3D Isometric View with crossings -->
  <g transform="translate(40, 65)">
    <rect width="320" height="185" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />
    <text x="160" y="24" fill="#38bdf8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Perspective Projection (Apparent Crossings)</text>
    
    <!-- Cube projection lines -->
    <!-- Back face -->
    <rect x="70" y="50" width="90" height="60" stroke="#64748b" stroke-width="1.8" fill="none" stroke-dasharray="3 3" />
    <!-- Front face -->
    <rect x="110" y="80" width="90" height="60" stroke="#38bdf8" stroke-width="2" fill="none" />
    <!-- Connecting struts -->
    <line x1="70" y1="50" x2="110" y2="80" stroke="#38bdf8" stroke-width="2" />
    <line x1="160" y1="50" x2="200" y2="80" stroke="#38bdf8" stroke-width="2" />
    <line x1="70" y1="110" x2="110" y2="140" stroke="#38bdf8" stroke-width="2" />
    <line x1="160" y1="110" x2="200" y2="140" stroke="#38bdf8" stroke-width="2" />

    <text x="160" y="165" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Visual overlap makes it seem non-planar</text>
  </g>

  <!-- Right: Schlegel Diagram (Planar Embedding) -->
  <g transform="translate(400, 65)">
    <rect width="320" height="185" rx="10" fill="#182234" stroke="#059669" stroke-width="1.2" />
    <text x="160" y="24" fill="#34d399" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Schlegel Diagram (True Planar Embedding)</text>
    
    <!-- Outer Square -->
    <rect x="50" y="45" width="220" height="105" rx="4" stroke="#34d399" stroke-width="2.5" fill="none" />
    <!-- Inner Square -->
    <rect x="105" y="70" width="110" height="55" rx="4" stroke="#34d399" stroke-width="2" fill="none" />
    
    <!-- Corner connecting spokes -->
    <line x1="50" y1="45" x2="105" y2="70" stroke="#34d399" stroke-width="2" />
    <line x1="270" y1="45" x2="215" y2="70" stroke="#34d399" stroke-width="2" />
    <line x1="50" y1="150" x2="105" y2="125" stroke="#34d399" stroke-width="2" />
    <line x1="270" y1="150" x2="215" y2="125" stroke="#34d399" stroke-width="2" />

    <!-- 8 Vertices -->
    <circle cx="50" cy="45" r="5" fill="#34d399" /><circle cx="270" cy="45" r="5" fill="#34d399" />
    <circle cx="50" cy="150" r="5" fill="#34d399" /><circle cx="270" cy="150" r="5" fill="#34d399" />
    <circle cx="105" cy="70" r="5" fill="#38bdf8" /><circle cx="215" cy="70" r="5" fill="#38bdf8" />
    <circle cx="105" cy="125" r="5" fill="#38bdf8" /><circle cx="215" cy="125" r="5" fill="#38bdf8" />

    <text x="160" y="165" fill="#6ee7b7" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Zero crossings! 5 inner regions + 1 outer = 6</text>
  </g>
</svg>