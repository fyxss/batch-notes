<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-darknode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="720" height="270" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">The Three Houses and Three Utilities Problem (K₃,₃)</text>
  <text x="360" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Bipartite planar bound (no 3-cycles): e ≤ 2v - 4. For K₃,₃: v = 6, e = 9 ⟹ 9 ≤ 2(6) - 4 = 8 (CONTRADICTION!)</text>

  <!-- Top row: Houses H1, H2, H3 -->
  <g transform="translate(160, 65)">
    <!-- Edges from each house to each utility -->
    <!-- H1(60, 20) to U1, U2, U3 (60, 110), (190, 110), (320, 110) -->
    <line x1="60" y1="20" x2="60" y2="110" stroke="#475569" stroke-width="2" />
    <line x1="60" y1="20" x2="190" y2="110" stroke="#475569" stroke-width="2" />
    <line x1="60" y1="20" x2="320" y2="110" stroke="#f43f5e" stroke-width="2.5" />

    <!-- H2(190, 20) -->
    <line x1="190" y1="20" x2="60" y2="110" stroke="#475569" stroke-width="2" />
    <line x1="190" y1="20" x2="190" y2="110" stroke="#475569" stroke-width="2" />
    <line x1="190" y1="20" x2="320" y2="110" stroke="#475569" stroke-width="2" />

    <!-- H3(320, 20) -->
    <line x1="320" y1="20" x2="60" y2="110" stroke="#f43f5e" stroke-width="2.5" />
    <line x1="320" y1="20" x2="190" y2="110" stroke="#475569" stroke-width="2" />
    <line x1="320" y1="20" x2="320" y2="110" stroke="#475569" stroke-width="2" />

    <!-- Houses Nodes -->
    <circle cx="60" cy="20" r="16" fill="url(#grad-blue)" stroke="#fff" stroke-width="2" filter="url(#shadow)" />
    <text x="60" y="25" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">H₁</text>
    
    <circle cx="190" cy="20" r="16" fill="url(#grad-blue)" stroke="#fff" stroke-width="2" filter="url(#shadow)" />
    <text x="190" y="25" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">H₂</text>

    <circle cx="320" cy="20" r="16" fill="url(#grad-blue)" stroke="#fff" stroke-width="2" filter="url(#shadow)" />
    <text x="320" y="25" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">H₃</text>

    <!-- Utilities Nodes -->
    <circle cx="60" cy="110" r="16" fill="url(#grad-amber)" stroke="#fff" stroke-width="2" filter="url(#shadow)" />
    <text x="60" y="114" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">Gas</text>
    
    <circle cx="190" cy="110" r="16" fill="url(#grad-amber)" stroke="#fff" stroke-width="2" filter="url(#shadow)" />
    <text x="190" y="114" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">Water</text>

    <circle cx="320" cy="110" r="16" fill="url(#grad-amber)" stroke="#fff" stroke-width="2" filter="url(#shadow)" />
    <text x="320" y="114" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">Power</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="60" y="215" width="600" height="36" rx="8" fill="#182234" stroke="#e11d48" stroke-width="1.2" />
  <text x="360" y="232" fill="#fda4af" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Kuratowski's Second Obstruction: Non-Planar (e = 9 > 2(6) - 4 = 8)</text>
  <text x="360" y="246" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">At least one utility line must cross another when connecting all three houses.</text>
</svg>