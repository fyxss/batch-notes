<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-darknode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="740" height="260" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="370" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Planar Graph Embedding: Redrawing K₄ Without Crossings</text>
  <text x="370" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">A graph is planar if it can be drawn in the plane without edges crossing.</text>

  <!-- Left: Crossings -->
  <g transform="translate(40, 65)">
    <rect width="310" height="175" rx="10" fill="#182234" stroke="#e11d48" stroke-width="1.2" />
    <text x="155" y="25" fill="#fb7185" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Standard Drawing (With Crossing)</text>
    
    <!-- Edges -->
    <rect x="75" y="45" width="160" height="85" stroke="#64748b" stroke-width="2" fill="none" />
    <line x1="75" y1="45" x2="235" y2="130" stroke="#f43f5e" stroke-width="2.5" />
    <line x1="235" y1="45" x2="75" y2="130" stroke="#f43f5e" stroke-width="2.5" />
    
    <!-- Crossing marker -->
    <circle cx="155" cy="87" r="6" fill="#f43f5e" />
    <text x="155" y="75" fill="#fb7185" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Crossing!</text>
    
    <!-- 4 nodes -->
    <circle cx="75" cy="45" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="75" y="49" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">1</text>
    <circle cx="235" cy="45" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="235" y="49" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">2</text>
    <circle cx="75" cy="130" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="75" y="134" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">4</text>
    <circle cx="235" cy="130" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="235" y="134" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">3</text>
    
    <text x="155" y="158" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Diagonal edges intersect at center</text>
  </g>

  <!-- Right: Planar Redraw -->
  <g transform="translate(390, 65)">
    <rect width="310" height="175" rx="10" fill="#182234" stroke="#059669" stroke-width="1.2" />
    <text x="155" y="25" fill="#34d399" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Planar Embedding (Zero Crossings)</text>
    
    <!-- Triangle 1-2-4 with node 3 inside -->
    <polygon points="155,45 65,140 245,140" stroke="#34d399" stroke-width="2" fill="none" />
    <!-- Node 3 inside connected to 1, 2, 4 -->
    <line x1="155" y1="45" x2="155" y2="105" stroke="#34d399" stroke-width="2" />
    <line x1="65" y1="140" x2="155" y2="105" stroke="#34d399" stroke-width="2" />
    <line x1="245" y1="140" x2="155" y2="105" stroke="#34d399" stroke-width="2" />
    
    <circle cx="155" cy="45" r="14" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" /><text x="155" y="49" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">1</text>
    <circle cx="65" cy="140" r="14" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" /><text x="65" y="144" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">4</text>
    <circle cx="245" cy="140" r="14" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" /><text x="245" y="144" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">2</text>
    <circle cx="155" cy="105" r="14" fill="url(#grad-amber)" stroke="#fff" stroke-width="1.5" filter="url(#shadow)" /><text x="155" y="109" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">3</text>
    
    <text x="155" y="158" fill="#6ee7b7" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Planar Graph: v=4, e=6, r=4 (v - e + r = 2)</text>
  </g>
</svg>