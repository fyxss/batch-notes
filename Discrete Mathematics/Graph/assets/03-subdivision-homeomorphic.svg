<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-darknode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="720" height="230" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Elementary Subdivision &amp; Graph Homeomorphism</text>
  <text x="360" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Kuratowski's Theorem: G is planar ⇔ G contains no subgraph homeomorphic to K₅ or K₃,₃.</text>

  <!-- Original Edge u-v -->
  <g transform="translate(60, 65)">
    <rect width="250" height="135" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />
    <text x="125" y="24" fill="#38bdf8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Original Edge {u, v}</text>
    
    <line x1="50" y1="75" x2="200" y2="75" stroke="#38bdf8" stroke-width="3" />
    <circle cx="50" cy="75" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="50" y="80" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">u</text>
    <circle cx="200" cy="75" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="200" y="80" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">v</text>
    
    <text x="125" y="118" fill="#64748b" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">1 Edge, 2 Vertices</text>
  </g>

  <!-- Transition Arrow -->
  <g transform="translate(330, 115)">
    <path d="M 0 10 L 40 10" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-emerald)" />
    <text x="20" y="-2" fill="#34d399" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Subdivide</text>
  </g>

  <!-- Subdivided Edge u-w-v -->
  <g transform="translate(390, 65)">
    <rect width="270" height="135" rx="10" fill="#182234" stroke="#059669" stroke-width="1.2" />
    <text x="135" y="24" fill="#34d399" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Subdivided (Homeomorphic)</text>
    
    <line x1="45" y1="75" x2="135" y2="75" stroke="#34d399" stroke-width="3" />
    <line x1="135" y1="75" x2="225" y2="75" stroke="#34d399" stroke-width="3" />
    
    <circle cx="45" cy="75" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="45" y="80" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">u</text>
    <circle cx="135" cy="75" r="15" fill="url(#grad-emerald)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="135" y="80" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">w</text>
    <circle cx="225" cy="75" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="225" y="80" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">v</text>
    
    <text x="135" y="118" fill="#6ee7b7" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Degree of inserted node w is exactly 2</text>
  </g>
</svg>