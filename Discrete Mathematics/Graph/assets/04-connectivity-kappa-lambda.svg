<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-darknode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="760" height="250" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="380" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Vertex Connectivity κ(G) vs. Edge Connectivity λ(G)</text>
  <text x="380" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Whitney's Theorem: κ(G) ≤ λ(G) ≤ min deg(v)</text>

  <!-- Case 1: Bridge -->
  <g transform="translate(30, 65)">
    <rect width="210" height="165" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />
    <text x="105" y="24" fill="#fb7185" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">1. Single Bridge Graph</text>
    <text x="105" y="40" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">κ(G) = 1,  λ(G) = 1</text>
    
    <!-- Left Triangle -->
    <polygon points="25,75 25,125 65,100" stroke="#64748b" stroke-width="1.8" fill="none" />
    <!-- Right Triangle -->
    <polygon points="185,75 185,125 145,100" stroke="#64748b" stroke-width="1.8" fill="none" />
    <!-- Single Bridge Edge -->
    <line x1="65" y1="100" x2="145" y2="100" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4 2" />
    
    <!-- Left Vertices -->
    <circle cx="25" cy="75" r="6" fill="url(#grad-blue)" stroke="#fff" stroke-width="1" />
    <circle cx="25" cy="125" r="6" fill="url(#grad-blue)" stroke="#fff" stroke-width="1" />
    <circle cx="65" cy="100" r="8" fill="url(#grad-rose)" stroke="#fff" stroke-width="1.5" />
    
    <!-- Right Vertices -->
    <circle cx="145" cy="100" r="8" fill="url(#grad-rose)" stroke="#fff" stroke-width="1.5" />
    <circle cx="185" cy="75" r="6" fill="url(#grad-blue)" stroke="#fff" stroke-width="1" />
    <circle cx="185" cy="125" r="6" fill="url(#grad-blue)" stroke="#fff" stroke-width="1" />
    
    <text x="105" y="148" fill="#fda4af" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">1 edge/vertex cuts graph</text>
  </g>

  <!-- Case 2: Cycle C4 -->
  <g transform="translate(265, 65)">
    <rect width="210" height="165" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />
    <text x="105" y="24" fill="#38bdf8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">2. Cycle C₄</text>
    <text x="105" y="40" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">κ(C₄) = 2,  λ(C₄) = 2</text>
    
    <rect x="65" y="65" width="80" height="60" stroke="#38bdf8" stroke-width="2.5" fill="none" />
    <circle cx="65" cy="65" r="8" fill="url(#grad-blue)" stroke="#fff" stroke-width="1" />
    <circle cx="145" cy="65" r="8" fill="url(#grad-blue)" stroke="#fff" stroke-width="1" />
    <circle cx="65" cy="125" r="8" fill="url(#grad-blue)" stroke="#fff" stroke-width="1" />
    <circle cx="145" cy="125" r="8" fill="url(#grad-blue)" stroke="#fff" stroke-width="1" />
    
    <text x="105" y="148" fill="#7dd3fc" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Must cut 2 independent nodes</text>
  </g>

  <!-- Case 3: Complete Graph K4 -->
  <g transform="translate(500, 65)">
    <rect width="230" height="165" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />
    <text x="115" y="24" fill="#34d399" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">3. Complete K₄ (3-connected)</text>
    <text x="115" y="40" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">κ = 3,  λ = 3,  min deg = 3</text>
    
    <rect x="75" y="65" width="80" height="60" stroke="#34d399" stroke-width="2" fill="none" />
    <line x1="75" y1="65" x2="155" y2="125" stroke="#34d399" stroke-width="1.8" />
    <line x1="155" y1="65" x2="75" y2="125" stroke="#34d399" stroke-width="1.8" />
    
    <circle cx="75" cy="65" r="8" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1" />
    <circle cx="155" cy="65" r="8" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1" />
    <circle cx="75" cy="125" r="8" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1" />
    <circle cx="155" cy="125" r="8" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1" />
    
    <text x="115" y="148" fill="#6ee7b7" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Equality: κ(G) = λ(G) = δ(G) = 3</text>
  </g>
</svg>