<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-darknode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="760" height="260" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="380" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Vulnerability Analysis: Cut Vertices (Articulation Points) &amp; Bridges</text>
  <text x="380" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Removing a cut vertex or bridge strictly increases the number of connected components.</text>

  <!-- Network Layout -->
  <g transform="translate(60, 65)">
    <rect width="640" height="170" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />
    
    <!-- Edges -->
    <line x1="60" y1="50" x2="160" y2="50" stroke="#64748b" stroke-width="2" />
    <line x1="160" y1="50" x2="260" y2="50" stroke="#64748b" stroke-width="2" />
    <line x1="160" y1="50" x2="160" y2="120" stroke="#64748b" stroke-width="2" />
    <line x1="260" y1="50" x2="260" y2="120" stroke="#64748b" stroke-width="2" />
    <line x1="160" y1="120" x2="260" y2="120" stroke="#64748b" stroke-width="2" />
    
    <!-- Bridge edge e - f highlighted -->
    <line x1="260" y1="120" x2="420" y2="120" stroke="#f43f5e" stroke-width="4" stroke-dasharray="6 3" />
    
    <!-- Component beyond bridge (2-connected triangle f-g-h) -->
    <line x1="420" y1="120" x2="520" y2="50" stroke="#64748b" stroke-width="2" />
    <line x1="420" y1="120" x2="520" y2="120" stroke="#64748b" stroke-width="2" />
    <line x1="520" y1="50" x2="520" y2="120" stroke="#64748b" stroke-width="2" />

    <!-- Vertices -->
    <!-- a -->
    <circle cx="60" cy="50" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="60" y="55" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">a</text>
    
    <!-- b: Cut vertex! -->
    <circle cx="160" cy="50" r="18" fill="url(#grad-amber)" stroke="#fff" stroke-width="2.5" filter="url(#shadow)" />
    <text x="160" y="55" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">b</text>
    <rect x="110" y="10" width="100" height="20" rx="4" fill="#0f172a" stroke="#fbbf24" />
    <text x="160" y="24" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">Cut Vertex</text>
    
    <!-- c, d, e -->
    <circle cx="260" cy="50" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="260" y="55" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">c</text>
    <circle cx="160" cy="120" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="160" y="125" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">d</text>
    <circle cx="260" cy="120" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="260" y="125" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">e</text>
    
    <!-- Bridge Callout -->
    <rect x="290" y="90" width="100" height="22" rx="4" fill="#0f172a" stroke="#f43f5e" />
    <text x="340" y="105" fill="#fb7185" font-size="10" font-weight="bold" text-anchor="middle">Bridge {e, f}</text>

    <!-- f, g -->
    <circle cx="420" cy="120" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="420" y="125" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">f</text>
    <circle cx="520" cy="50" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="520" y="55" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">g</text>
    <circle cx="520" cy="120" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="520" y="125" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">h</text>
  </g>
</svg>