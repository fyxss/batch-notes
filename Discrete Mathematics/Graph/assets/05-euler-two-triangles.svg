<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="720" height="250" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Eulerian Circuit Construction: Two Triangles Sharing Vertex c</text>
  <text x="360" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Vertex degrees: deg(a)=2, deg(b)=2, deg(c)=4, deg(d)=2, deg(e)=2. All degrees EVEN ⟹ Euler Circuit Exists!</text>

  <g transform="translate(180, 55)">
    <!-- Left triangle: a(40, 40), b(40, 140), c(180, 90) -->
    <!-- Right triangle: c(180, 90), d(320, 40), e(320, 140) -->
    
    <!-- Edges -->
    <polygon points="40,40 40,140 180,90" stroke="#34d399" stroke-width="3" fill="none" />
    <polygon points="180,90 320,40 320,140" stroke="#38bdf8" stroke-width="3" fill="none" />

    <!-- Vertices -->
    <circle cx="40" cy="40" r="15" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" /><text x="40" y="45" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">a</text>
    <circle cx="40" cy="140" r="15" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" /><text x="40" y="145" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">b</text>
    
    <!-- Shared vertex c -->
    <circle cx="180" cy="90" r="18" fill="url(#grad-purple)" stroke="#fff" stroke-width="2.5" filter="url(#shadow)" />
    <text x="180" y="95" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">c</text>
    <rect x="145" y="118" width="70" height="20" rx="4" fill="#0f172a" stroke="#c084fc" />
    <text x="180" y="132" fill="#c084fc" font-size="10" font-weight="bold" text-anchor="middle">deg(c) = 4</text>

    <circle cx="320" cy="40" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="320" y="45" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">d</text>
    <circle cx="320" cy="140" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="320" y="145" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">e</text>
  </g>

  <!-- Circuit Trace -->
  <rect x="100" y="210" width="520" height="28" rx="6" fill="#182234" stroke="#334155" />
  <text x="360" y="228" fill="#34d399" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Valid Euler Circuit: a → b → c → d → e → c → a (All 6 edges traversed once)</text>
</svg>