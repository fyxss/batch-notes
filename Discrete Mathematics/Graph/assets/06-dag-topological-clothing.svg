<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="760" height="270" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="380" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Directed Acyclic Graph (DAG) &amp; Morning Dressing Sequence</text>
  <text x="380" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Dependency arcs require item u to be donned before item v. Solved via Kahn's in-degree 0 topological sort.</text>

  <!-- DAG Layout -->
  <g transform="translate(50, 65)">
    <!-- Socks -> Shoes -->
    <rect x="20" y="20" width="90" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" />
    <text x="65" y="39" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">left sock</text>
    <line x1="110" y1="35" x2="160" y2="35" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="165" y="20" width="90" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" />
    <text x="210" y="39" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">left shoe</text>

    <!-- Underwear -> Pants -> Belt -->
    <rect x="20" y="70" width="90" height="30" rx="6" fill="#1e293b" stroke="#34d399" />
    <text x="65" y="89" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">underwear</text>
    <line x1="110" y1="85" x2="160" y2="85" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="165" y="70" width="90" height="30" rx="6" fill="#1e293b" stroke="#34d399" />
    <text x="210" y="89" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">pants</text>
    <line x1="255" y1="85" x2="305" y2="85" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="310" y="70" width="80" height="30" rx="6" fill="#1e293b" stroke="#34d399" />
    <text x="350" y="89" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">belt</text>

    <!-- Pants -> Shoes cross arc -->
    <path d="M 210 70 L 210 55" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)" />

    <!-- Shirt -> Tie -> Jacket -->
    <rect x="20" y="120" width="90" height="30" rx="6" fill="#1e293b" stroke="#c084fc" />
    <text x="65" y="139" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">shirt</text>
    <line x1="110" y1="135" x2="160" y2="135" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" />
    <rect x="165" y="120" width="70" height="30" rx="6" fill="#1e293b" stroke="#c084fc" />
    <text x="200" y="139" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">tie</text>
    <line x1="235" y1="135" x2="285" y2="135" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" />
    <rect x="290" y="120" width="80" height="30" rx="6" fill="#1e293b" stroke="#c084fc" />
    <text x="330" y="139" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">jacket</text>

    <!-- Belt -> Jacket -->
    <path d="M 350 100 L 330 115" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)" />

    <!-- Independent: Watch -->
    <rect x="440" y="70" width="80" height="30" rx="6" fill="#1e293b" stroke="#64748b" stroke-dasharray="3 3" />
    <text x="480" y="89" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">watch</text>
    <text x="480" y="112" fill="#64748b" font-size="10" text-anchor="middle">(Independent)</text>
  </g>

  <!-- Topological Sort Output Banner -->
  <rect x="40" y="225" width="680" height="28" rx="6" fill="#182234" stroke="#334155" />
  <text x="380" y="243" fill="#34d399" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">Linear Order: underwear ⟶ pants ⟶ belt ⟶ shirt ⟶ tie ⟶ jacket ⟶ socks ⟶ shoes ⟶ watch</text>
</svg>