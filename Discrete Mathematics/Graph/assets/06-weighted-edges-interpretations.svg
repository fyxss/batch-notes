<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="740" height="240" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="370" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Domain Modeling: Semantics of Weighted Edges</text>
  <text x="370" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Edge weights quantify cost metrics depending on the target application.</text>

  <!-- Metric 1: Physical Distance -->
  <g transform="translate(35, 65)">
    <rect width="205" height="150" rx="10" fill="#182234" stroke="#38bdf8" stroke-width="1.2" />
    <text x="102" y="24" fill="#38bdf8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">1. Physical Distance</text>
    
    <line x1="40" y1="75" x2="165" y2="75" stroke="#38bdf8" stroke-width="2.5" />
    <rect x="80" y="58" width="45" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" />
    <text x="102" y="71" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">12 km</text>

    <circle cx="40" cy="75" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="40" y="80" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">A</text>
    <circle cx="165" cy="75" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="165" y="80" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">B</text>

    <text x="102" y="125" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">GPS / Shortest Route</text>
  </g>

  <!-- Metric 2: Travel Latency -->
  <g transform="translate(265, 65)">
    <rect width="205" height="150" rx="10" fill="#182234" stroke="#34d399" stroke-width="1.2" />
    <text x="102" y="24" fill="#34d399" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">2. Travel Latency</text>
    
    <line x1="40" y1="75" x2="165" y2="75" stroke="#34d399" stroke-width="2.5" />
    <rect x="75" y="58" width="55" height="18" rx="4" fill="#0f172a" stroke="#34d399" />
    <text x="102" y="71" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">15 min</text>

    <circle cx="40" cy="75" r="14" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" /><text x="40" y="80" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">A</text>
    <circle cx="165" cy="75" r="14" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" /><text x="165" y="80" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">B</text>

    <text x="102" y="125" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Traffic / Fastest Route</text>
  </g>

  <!-- Metric 3: Financial Toll -->
  <g transform="translate(495, 65)">
    <rect width="210" height="150" rx="10" fill="#182234" stroke="#fbbf24" stroke-width="1.2" />
    <text x="105" y="24" fill="#fbbf24" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">3. Economic Cost</text>
    
    <line x1="40" y1="75" x2="170" y2="75" stroke="#fbbf24" stroke-width="2.5" />
    <rect x="80" y="58" width="50" height="18" rx="4" fill="#0f172a" stroke="#fbbf24" />
    <text x="105" y="71" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">$4.50</text>

    <circle cx="40" cy="75" r="14" fill="url(#grad-amber)" stroke="#fff" stroke-width="1.5" /><text x="40" y="80" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">A</text>
    <circle cx="170" cy="75" r="14" fill="url(#grad-amber)" stroke="#fff" stroke-width="1.5" /><text x="170" y="80" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">B</text>

    <text x="105" y="125" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Tolls / Cheapest Route</text>
  </g>
</svg>