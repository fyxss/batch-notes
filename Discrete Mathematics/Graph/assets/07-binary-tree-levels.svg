<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="740" height="260" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="370" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Height, Levels, and Leaf Bounds in m-ary Trees (m = 2)</text>
  <text x="370" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Theorem 5: A full m-ary tree with height h has at most mʰ leaves (l ≤ mʰ).</text>

  <g transform="translate(60, 65)">
    <!-- Levels on Left, Tree on Right -->
    <text x="20" y="30" fill="#38bdf8" font-size="12" font-weight="bold">Level 0 (Root):</text>
    <text x="20" y="80" fill="#34d399" font-size="12" font-weight="bold">Level 1:</text>
    <text x="20" y="130" fill="#c084fc" font-size="12" font-weight="bold">Level 2 (Leaves):</text>

    <!-- Formula Counts on Left -->
    <text x="140" y="30" fill="#94a3b8" font-size="11">Max leaves = 2⁰ = 1</text>
    <text x="140" y="80" fill="#94a3b8" font-size="11">Max leaves = 2¹ = 2</text>
    <text x="140" y="130" fill="#94a3b8" font-size="11">Max leaves = 2² = 4 = 2ʰ</text>

    <!-- Tree Graphic -->
    <!-- Edges -->
    <line x1="420" y1="25" x2="350" y2="75" stroke="#64748b" stroke-width="2" />
    <line x1="420" y1="25" x2="490" y2="75" stroke="#64748b" stroke-width="2" />
    
    <line x1="350" y1="75" x2="310" y2="125" stroke="#64748b" stroke-width="2" />
    <line x1="350" y1="75" x2="390" y2="125" stroke="#64748b" stroke-width="2" />
    <line x1="490" y1="75" x2="450" y2="125" stroke="#64748b" stroke-width="2" />
    <line x1="490" y1="75" x2="530" y2="125" stroke="#64748b" stroke-width="2" />

    <!-- Nodes -->
    <circle cx="420" cy="25" r="12" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" />
    <circle cx="350" cy="75" r="11" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" />
    <circle cx="490" cy="75" r="11" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" />
    
    <circle cx="310" cy="125" r="10" fill="url(#grad-purple)" stroke="#fff" stroke-width="1.5" />
    <circle cx="390" cy="125" r="10" fill="url(#grad-purple)" stroke="#fff" stroke-width="1.5" />
    <circle cx="450" cy="125" r="10" fill="url(#grad-purple)" stroke="#fff" stroke-width="1.5" />
    <circle cx="530" cy="125" r="10" fill="url(#grad-purple)" stroke="#fff" stroke-width="1.5" />
  </g>

  <!-- Bottom Banner -->
  <rect x="100" y="215" width="540" height="28" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="370" y="233" fill="#38bdf8" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Balanced Property: Height h ≥ ⌈log_m l⌉ ⟹ Height is logarithmic O(log n)</text>
</svg>