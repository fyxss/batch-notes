<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="740" height="250" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="370" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Connected Graph G vs. Spanning Tree T</text>
  <text x="370" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">A spanning tree contains ALL vertices of G, is connected, and has exactly e = n - 1 edges (no cycles).</text>

  <!-- Left: Original Graph G (4 vertices, 6 edges) -->
  <g transform="translate(50, 65)">
    <rect width="300" height="165" rx="10" fill="#182234" stroke="#334155" />
    <text x="150" y="24" fill="#38bdf8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Connected Graph G (K₄)</text>
    
    <rect x="80" y="45" width="140" height="70" stroke="#64748b" stroke-width="2" fill="none" />
    <line x1="80" y1="45" x2="220" y2="115" stroke="#64748b" stroke-width="2" />
    <line x1="220" y1="45" x2="80" y2="115" stroke="#64748b" stroke-width="2" />

    <circle cx="80" cy="45" r="12" fill="url(#grad-blue)" stroke="#fff" /><text x="80" y="49" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">a</text>
    <circle cx="220" cy="45" r="12" fill="url(#grad-blue)" stroke="#fff" /><text x="220" y="49" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">b</text>
    <circle cx="80" cy="115" r="12" fill="url(#grad-blue)" stroke="#fff" /><text x="80" y="119" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">c</text>
    <circle cx="220" cy="115" r="12" fill="url(#grad-blue)" stroke="#fff" /><text x="220" y="119" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">d</text>

    <text x="150" y="150" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">v = 4, e = 6 (Redundant cycles)</text>
  </g>

  <!-- Right: Spanning Tree T (4 vertices, 3 edges) -->
  <g transform="translate(390, 65)">
    <rect width="300" height="165" rx="10" fill="#182234" stroke="#059669" stroke-width="1.2" />
    <text x="150" y="24" fill="#34d399" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">A Spanning Tree T of G</text>
    
    <!-- Edges: a-b, a-c, c-d (3 edges, acyclic) -->
    <line x1="80" y1="45" x2="220" y2="45" stroke="#34d399" stroke-width="3" />
    <line x1="80" y1="45" x2="80" y2="115" stroke="#34d399" stroke-width="3" />
    <line x1="80" y1="115" x2="220" y2="115" stroke="#34d399" stroke-width="3" />

    <circle cx="80" cy="45" r="12" fill="url(#grad-emerald)" stroke="#fff" /><text x="80" y="49" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">a</text>
    <circle cx="220" cy="45" r="12" fill="url(#grad-emerald)" stroke="#fff" /><text x="220" y="49" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">b</text>
    <circle cx="80" cy="115" r="12" fill="url(#grad-emerald)" stroke="#fff" /><text x="80" y="119" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">c</text>
    <circle cx="220" cy="115" r="12" fill="url(#grad-emerald)" stroke="#fff" /><text x="220" y="119" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">d</text>

    <text x="150" y="150" fill="#6ee7b7" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">v = 4, e = 3 = n - 1 (Minimal connector)</text>
  </g>
</svg>