<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="720" height="270" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Rooted Tree Terminology &amp; Hierarchical Levels</text>
  <text x="360" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Root is at Level 0. Height h is the maximum level of any vertex (h = 2 here).</text>

  <!-- Level lines -->
  <g transform="translate(60, 60)">
    <!-- Level 0 Guide -->
    <line x1="80" y1="30" x2="580" y2="30" stroke="#334155" stroke-dasharray="2 4" />
    <text x="30" y="34" fill="#38bdf8" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">Level 0</text>

    <!-- Level 1 Guide -->
    <line x1="80" y1="95" x2="580" y2="95" stroke="#334155" stroke-dasharray="2 4" />
    <text x="30" y="99" fill="#34d399" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">Level 1</text>

    <!-- Level 2 Guide -->
    <line x1="80" y1="160" x2="580" y2="160" stroke="#334155" stroke-dasharray="2 4" />
    <text x="30" y="164" fill="#c084fc" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">Level 2</text>

    <!-- Tree edges -->
    <line x1="330" y1="30" x2="210" y2="95" stroke="#64748b" stroke-width="2" />
    <line x1="330" y1="30" x2="450" y2="95" stroke="#64748b" stroke-width="2" />
    <line x1="210" y1="95" x2="150" y2="160" stroke="#64748b" stroke-width="2" />
    <line x1="210" y1="95" x2="270" y2="160" stroke="#64748b" stroke-width="2" />
    <line x1="450" y1="95" x2="450" y2="160" stroke="#64748b" stroke-width="2" />

    <!-- Root Node A -->
    <circle cx="330" cy="30" r="16" fill="url(#grad-blue)" stroke="#fff" stroke-width="2" filter="url(#shadow)" />
    <text x="330" y="35" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">A</text>
    <rect x="360" y="20" width="75" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" />
    <text x="397" y="33" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Root Node</text>

    <!-- Internal Nodes B, C -->
    <circle cx="210" cy="95" r="15" fill="url(#grad-emerald)" stroke="#fff" stroke-width="2" filter="url(#shadow)" />
    <text x="210" y="100" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">B</text>
    
    <circle cx="450" cy="95" r="15" fill="url(#grad-emerald)" stroke="#fff" stroke-width="2" filter="url(#shadow)" />
    <text x="450" y="100" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">C</text>

    <!-- Leaves D, E, F -->
    <circle cx="150" cy="160" r="14" fill="url(#grad-purple)" stroke="#fff" stroke-width="1.5" />
    <text x="150" y="165" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">D</text>

    <circle cx="270" cy="160" r="14" fill="url(#grad-purple)" stroke="#fff" stroke-width="1.5" />
    <text x="270" y="165" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">E</text>

    <circle cx="450" cy="160" r="14" fill="url(#grad-purple)" stroke="#fff" stroke-width="1.5" />
    <text x="450" y="165" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">F</text>
  </g>

  <!-- Legend -->
  <rect x="120" y="235" width="480" height="24" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="360" y="251" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Internal Vertices (degree ≥ 1 with children): {A, B, C} • Leaves (degree 0 children): {D, E, F}</text>
</svg>