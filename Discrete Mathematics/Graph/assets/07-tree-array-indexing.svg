<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="740" height="260" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="370" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Sequential Array Representation of Binary Trees</text>
  <text x="370" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Zero-based arithmetic formulas: Left(i) = 2i + 1, Right(i) = 2i + 2, Parent(i) = ⌊(i - 1)/2⌋</text>

  <!-- Left: Tree Structure -->
  <g transform="translate(40, 65)">
    <rect width="260" height="170" rx="10" fill="#182234" stroke="#334155" />
    <line x1="130" y1="25" x2="70" y2="70" stroke="#64748b" stroke-width="2" />
    <line x1="130" y1="25" x2="190" y2="70" stroke="#64748b" stroke-width="2" />
    <line x1="70" y1="70" x2="40" y2="120" stroke="#64748b" stroke-width="2" />
    <line x1="70" y1="70" x2="100" y2="120" stroke="#64748b" stroke-width="2" />
    <line x1="190" y1="70" x2="160" y2="120" stroke="#64748b" stroke-width="2" />
    <line x1="190" y1="70" x2="220" y2="120" stroke="#64748b" stroke-width="2" />

    <!-- A(0) -->
    <circle cx="130" cy="25" r="12" fill="url(#grad-blue)" stroke="#fff" /><text x="130" y="29" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">A:0</text>
    <!-- B(1), C(2) -->
    <circle cx="70" cy="70" r="12" fill="url(#grad-emerald)" stroke="#fff" /><text x="70" y="74" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">B:1</text>
    <circle cx="190" cy="70" r="12" fill="url(#grad-emerald)" stroke="#fff" /><text x="190" y="74" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">C:2</text>
    <!-- D(3), E(4), F(5), G(6) -->
    <circle cx="40" cy="120" r="11" fill="url(#grad-purple)" stroke="#fff" /><text x="40" y="124" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">D:3</text>
    <circle cx="100" cy="120" r="11" fill="url(#grad-purple)" stroke="#fff" /><text x="100" y="124" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">E:4</text>
    <circle cx="160" cy="120" r="11" fill="url(#grad-purple)" stroke="#fff" /><text x="160" y="124" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">F:5</text>
    <circle cx="220" cy="120" r="11" fill="url(#grad-purple)" stroke="#fff" /><text x="220" y="124" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">G:6</text>
    
    <text x="130" y="155" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Hierarchical Tree</text>
  </g>

  <!-- Right: 1D Array Cells -->
  <g transform="translate(320, 65)">
    <rect width="380" height="170" rx="10" fill="#182234" stroke="#334155" />
    <text x="190" y="26" fill="#f8fafc" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Contiguous Memory Buffer: array[0..6]</text>
    
    <!-- Array Boxes -->
    <!-- 7 cells, width=48 each -->
    <g transform="translate(22, 50)">
      <!-- Indices -->
      <text x="24" y="-8" fill="#64748b" font-size="11" font-family="monospace" text-anchor="middle">[0]</text>
      <text x="72" y="-8" fill="#64748b" font-size="11" font-family="monospace" text-anchor="middle">[1]</text>
      <text x="120" y="-8" fill="#64748b" font-size="11" font-family="monospace" text-anchor="middle">[2]</text>
      <text x="168" y="-8" fill="#64748b" font-size="11" font-family="monospace" text-anchor="middle">[3]</text>
      <text x="216" y="-8" fill="#64748b" font-size="11" font-family="monospace" text-anchor="middle">[4]</text>
      <text x="264" y="-8" fill="#64748b" font-size="11" font-family="monospace" text-anchor="middle">[5]</text>
      <text x="312" y="-8" fill="#64748b" font-size="11" font-family="monospace" text-anchor="middle">[6]</text>
      
      <!-- Values -->
      <rect x="0" y="0" width="48" height="40" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" /><text x="24" y="25" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">A</text>
      <rect x="48" y="0" width="48" height="40" fill="#1e293b" stroke="#34d399" stroke-width="1.5" /><text x="72" y="25" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">B</text>
      <rect x="96" y="0" width="48" height="40" fill="#1e293b" stroke="#34d399" stroke-width="1.5" /><text x="120" y="25" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">C</text>
      <rect x="144" y="0" width="48" height="40" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" /><text x="168" y="25" fill="#c084fc" font-size="14" font-weight="bold" text-anchor="middle">D</text>
      <rect x="192" y="0" width="48" height="40" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" /><text x="216" y="25" fill="#c084fc" font-size="14" font-weight="bold" text-anchor="middle">E</text>
      <rect x="240" y="0" width="48" height="40" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" /><text x="264" y="25" fill="#c084fc" font-size="14" font-weight="bold" text-anchor="middle">F</text>
      <rect x="288" y="0" width="48" height="40" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" /><text x="312" y="25" fill="#c084fc" font-size="14" font-weight="bold" text-anchor="middle">G</text>
    </g>

    <text x="190" y="130" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Zero Pointer Overhead • O(1) Immediate Random Indexing</text>
    <text x="190" y="150" fill="#fbbf24" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Parent of index 4 (E): ⌊(4 - 1)/2⌋ = 1 (B)</text>
  </g>
</svg>