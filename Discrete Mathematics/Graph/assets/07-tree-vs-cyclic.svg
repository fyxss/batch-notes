<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="740" height="250" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="370" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Defining a Tree: Connected &amp; Acyclic Graph</text>
  <text x="370" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Theorem: An undirected graph is a tree ⇔ there is a unique simple path between any two vertices.</text>

  <!-- Left: Valid Tree -->
  <g transform="translate(50, 65)">
    <rect width="300" height="165" rx="10" fill="#182234" stroke="#059669" stroke-width="1.2" />
    <text x="150" y="24" fill="#34d399" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Tree (Connected &amp; Acyclic)</text>
    
    <!-- Edges -->
    <line x1="150" y1="45" x2="90" y2="90" stroke="#34d399" stroke-width="2" />
    <line x1="150" y1="45" x2="210" y2="90" stroke="#34d399" stroke-width="2" />
    <line x1="90" y1="90" x2="60" y2="135" stroke="#34d399" stroke-width="2" />
    <line x1="90" y1="90" x2="120" y2="135" stroke="#34d399" stroke-width="2" />
    <line x1="210" y1="90" x2="210" y2="135" stroke="#34d399" stroke-width="2" />

    <!-- Nodes -->
    <circle cx="150" cy="45" r="10" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" />
    <circle cx="90" cy="90" r="10" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" />
    <circle cx="210" cy="90" r="10" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" />
    <circle cx="60" cy="135" r="9" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" />
    <circle cx="120" cy="135" r="9" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" />
    <circle cx="210" cy="135" r="9" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" />

    <text x="150" y="155" fill="#6ee7b7" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">e = n - 1 = 6 - 1 = 5 edges • Zero Cycles</text>
  </g>

  <!-- Right: Cyclic (NOT a tree) -->
  <g transform="translate(390, 65)">
    <rect width="300" height="165" rx="10" fill="#182234" stroke="#e11d48" stroke-width="1.2" />
    <text x="150" y="24" fill="#fb7185" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">NOT a Tree (Contains a Cycle)</text>
    
    <!-- Edges with a triangle cycle -->
    <line x1="150" y1="45" x2="90" y2="90" stroke="#f43f5e" stroke-width="2.5" />
    <line x1="150" y1="45" x2="210" y2="90" stroke="#f43f5e" stroke-width="2.5" />
    <line x1="90" y1="90" x2="210" y2="90" stroke="#f43f5e" stroke-width="3" stroke-dasharray="4 2" />
    <line x1="90" y1="90" x2="60" y2="135" stroke="#64748b" stroke-width="2" />
    <line x1="210" y1="90" x2="240" y2="135" stroke="#64748b" stroke-width="2" />

    <!-- Cycle Label -->
    <rect x="115" y="80" width="70" height="20" rx="4" fill="#0f172a" stroke="#f43f5e" />
    <text x="150" y="94" fill="#fda4af" font-size="10" font-weight="bold" text-anchor="middle">Cycle!</text>

    <!-- Nodes -->
    <circle cx="150" cy="45" r="10" fill="url(#grad-rose)" stroke="#fff" stroke-width="1.5" />
    <circle cx="90" cy="90" r="10" fill="url(#grad-rose)" stroke="#fff" stroke-width="1.5" />
    <circle cx="210" cy="90" r="10" fill="url(#grad-rose)" stroke="#fff" stroke-width="1.5" />
    <circle cx="60" cy="135" r="9" fill="url(#grad-rose)" stroke="#fff" stroke-width="1.5" />
    <circle cx="240" cy="135" r="9" fill="url(#grad-rose)" stroke="#fff" stroke-width="1.5" />

    <text x="150" y="155" fill="#fda4af" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Multiple simple paths between vertices</text>
  </g>
</svg>