<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="720" height="270" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">DFS Spanning Forest: Tree Edges vs. Back Edges</text>
  <text x="360" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Back edges connect a descendant to an ancestor in the DFS tree, indicating cycles in the original graph.</text>

  <g transform="translate(180, 55)">
    <!-- Root a(180, 20) -> b(180, 75) -->
    <line x1="180" y1="20" x2="180" y2="75" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />
    
    <!-- b(180, 75) -> c(110, 135) and b -> d(250, 135) -->
    <line x1="180" y1="75" x2="110" y2="135" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />
    <line x1="180" y1="75" x2="250" y2="135" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />

    <!-- c(110, 135) -> e(110, 195) -->
    <line x1="110" y1="135" x2="110" y2="195" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />

    <!-- BACK EDGE: d(250, 135) -> ancestor a(180, 20) (Cycle: a -> b -> d -> a) -->
    <path d="M 250 120 C 295 70 240 20 198 20" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow-rose)" />

    <!-- Nodes -->
    <circle cx="180" cy="20" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="180" y="25" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">a</text>
    <circle cx="180" cy="75" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="180" y="80" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">b</text>
    <circle cx="110" cy="135" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="110" y="139" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">c</text>
    <circle cx="250" cy="135" r="14" fill="url(#grad-rose)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="250" y="139" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">d</text>
    <circle cx="110" cy="195" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" /><text x="110" y="199" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">e</text>
  </g>

  <!-- Legend -->
  <g transform="translate(480, 100)">
    <rect width="180" height="90" rx="8" fill="#182234" stroke="#334155" />
    <line x1="20" y1="30" x2="60" y2="30" stroke="#38bdf8" stroke-width="3" />
    <text x="75" y="34" fill="#38bdf8" font-size="11" font-weight="bold">Tree Edge</text>
    <line x1="20" y1="60" x2="60" y2="60" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4 2" />
    <text x="75" y="64" fill="#fb7185" font-size="11" font-weight="bold">Back Edge (Cycle!)</text>
  </g>
</svg>