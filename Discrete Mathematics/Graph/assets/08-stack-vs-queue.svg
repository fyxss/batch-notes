<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="760" height="250" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="380" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Data Structure Engines: Stack (DFS) vs. Queue (BFS)</text>
  <text x="380" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Stack enforces LIFO exploration (depth first); Queue enforces FIFO frontier exploration (level-by-level breadth first).</text>

  <!-- Left: Stack (LIFO) -->
  <g transform="translate(40, 65)">
    <rect width="320" height="165" rx="10" fill="#182234" stroke="#38bdf8" stroke-width="1.2" />
    <text x="160" y="24" fill="#38bdf8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Stack: LIFO (Last-In, First-Out)</text>
    
    <!-- Stack container -->
    <path d="M 120 45 L 120 135 L 200 135 L 200 45" stroke="#64748b" stroke-width="2.5" fill="none" />
    
    <!-- Elements in stack -->
    <rect x="125" y="108" width="70" height="24" rx="4" fill="url(#grad-blue)" />
    <text x="160" y="124" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">A (Bottom)</text>
    
    <rect x="125" y="80" width="70" height="24" rx="4" fill="url(#grad-blue)" />
    <text x="160" y="96" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">B</text>

    <rect x="125" y="52" width="70" height="24" rx="4" fill="url(#grad-blue)" filter="url(#shadow)" />
    <text x="160" y="68" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">C (Top)</text>

    <!-- Push/Pop arrows -->
    <path d="M 60 52 L 110 52" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)" />
    <text x="80" y="44" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">Push</text>
    
    <path d="M 210 52 L 260 52" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)" />
    <text x="240" y="44" fill="#fb7185" font-size="10" font-weight="bold" text-anchor="middle">Pop</text>

    <text x="160" y="152" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Engine for Depth-First Search (DFS)</text>
  </g>

  <!-- Right: Queue (FIFO) -->
  <g transform="translate(400, 65)">
    <rect width="320" height="165" rx="10" fill="#182234" stroke="#34d399" stroke-width="1.2" />
    <text x="160" y="24" fill="#34d399" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Queue: FIFO (First-In, First-Out)</text>
    
    <!-- Open queue channel -->
    <line x1="80" y1="75" x2="240" y2="75" stroke="#64748b" stroke-width="2" />
    <line x1="80" y1="115" x2="240" y2="115" stroke="#64748b" stroke-width="2" />

    <!-- Elements -->
    <rect x="85" y="80" width="45" height="30" rx="4" fill="url(#grad-emerald)" />
    <text x="107" y="99" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">C</text>

    <rect x="135" y="80" width="45" height="30" rx="4" fill="url(#grad-emerald)" />
    <text x="157" y="99" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">B</text>

    <rect x="185" y="80" width="45" height="30" rx="4" fill="url(#grad-emerald)" />
    <text x="207" y="99" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">A</text>

    <!-- Enqueue / Dequeue arrows -->
    <path d="M 35 95 L 75 95" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)" />
    <text x="55" y="85" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">Enqueue</text>

    <path d="M 245 95 L 285 95" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)" />
    <text x="265" y="85" fill="#fb7185" font-size="10" font-weight="bold" text-anchor="middle">Dequeue</text>

    <text x="160" y="152" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Engine for Breadth-First Search (BFS)</text>
  </g>
</svg>