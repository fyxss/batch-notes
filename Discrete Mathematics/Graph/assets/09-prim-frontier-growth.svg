<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="740" height="250" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="370" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Prim's MST Algorithm: Frontier Growth via the Cut Property</text>
  <text x="370" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">At every step, Prim greedily adds the minimum-weight edge bridging the cut between visited and unvisited vertices.</text>

  <!-- Step 1 -->
  <g transform="translate(40, 65)">
    <rect width="200" height="165" rx="10" fill="#182234" stroke="#334155" />
    <text x="100" y="24" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Step 1: Start at Root {a}</text>
    
    <circle cx="50" cy="65" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="50" y="70" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">a</text>
    <circle cx="50" cy="125" r="12" fill="#334155" stroke="#64748b" /><text x="50" y="129" fill="#94a3b8" font-size="10" text-anchor="middle">c</text>
    <circle cx="150" cy="65" r="12" fill="#334155" stroke="#64748b" /><text x="150" y="69" fill="#94a3b8" font-size="10" text-anchor="middle">b</text>

    <!-- Frontier options from a -->
    <line x1="50" y1="65" x2="50" y2="125" stroke="#34d399" stroke-width="2.5" />
    <rect x="25" y="88" width="16" height="16" rx="3" fill="#0f172a" /><text x="33" y="100" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">2</text>
    
    <line x1="50" y1="65" x2="150" y2="65" stroke="#64748b" stroke-width="1.5" />
    <rect x="95" y="55" width="16" height="16" rx="3" fill="#0f172a" /><text x="103" y="67" fill="#64748b" font-size="10" text-anchor="middle">4</text>

    <text x="100" y="152" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">Cheapest: edge (a, c) = 2</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(265, 65)">
    <rect width="210" height="165" rx="10" fill="#182234" stroke="#059669" stroke-width="1.2" />
    <text x="105" y="24" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">Step 2: Tree = {a, c}</text>
    
    <circle cx="50" cy="65" r="14" fill="url(#grad-emerald)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="50" y="70" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">a</text>
    <circle cx="50" cy="125" r="14" fill="url(#grad-emerald)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="50" y="130" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">c</text>
    <circle cx="150" cy="65" r="12" fill="#334155" stroke="#64748b" /><text x="150" y="69" fill="#94a3b8" font-size="10" text-anchor="middle">b</text>

    <line x1="50" y1="65" x2="50" y2="125" stroke="#34d399" stroke-width="3" />
    <!-- New frontier edge (c, b) = 1 -->
    <line x1="50" y1="125" x2="150" y2="65" stroke="#fbbf24" stroke-width="3" />
    <rect x="95" y="90" width="16" height="16" rx="3" fill="#0f172a" /><text x="103" y="102" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">1</text>

    <text x="105" y="152" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">Cheapest: edge (c, b) = 1</text>
  </g>

  <!-- Step 3 Complete -->
  <g transform="translate(500, 65)">
    <rect width="200" height="165" rx="10" fill="#182234" stroke="#334155" />
    <text x="100" y="24" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Step 3: Tree = {a, c, b}</text>
    
    <circle cx="50" cy="65" r="14" fill="url(#grad-amber)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="50" y="70" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">a</text>
    <circle cx="50" cy="125" r="14" fill="url(#grad-amber)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="50" y="130" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">c</text>
    <circle cx="150" cy="65" r="14" fill="url(#grad-amber)" stroke="#fff" stroke-width="2" filter="url(#shadow)" /><text x="150" y="70" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">b</text>

    <line x1="50" y1="65" x2="50" y2="125" stroke="#fbbf24" stroke-width="3" />
    <line x1="50" y1="125" x2="150" y2="65" stroke="#fbbf24" stroke-width="3" />

    <text x="100" y="152" fill="#fde047" font-size="10" font-weight="bold" text-anchor="middle">Weight: 2 + 1 = 3 (MST)</text>
  </g>
</svg>