<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="780" height="330" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="390" y="26" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Backtracking Decision Tree with Branch Pruning</text>
  <text x="390" y="44" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Subset Product Target = 12 from items [2, 3, 4, 2]. Violations (P &gt; 12) prune entire subtrees immediately.</text>

  <!-- Left Level Column Legend -->
  <g transform="translate(25, 68)">
    <rect x="0" y="0" width="110" height="215" rx="8" fill="#182234" stroke="#334155" stroke-width="1" />
    <text x="55" y="18" fill="#94a3b8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Decisions</text>
    
    <text x="55" y="58" fill="#38bdf8" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">x₁ = 2</text>
    <text x="55" y="108" fill="#38bdf8" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">x₂ = 3</text>
    <text x="55" y="158" fill="#38bdf8" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">x₃ = 4</text>
    <text x="55" y="202" fill="#38bdf8" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">x₄ = 2</text>
  </g>

  <!-- Root: Start (Empty set, Product = 1) -->
  <rect x="410" y="65" width="140" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
  <text x="480" y="83" fill="#38bdf8" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Start: ∅ (P = 1)</text>

  <!-- Depth 1 Edges (x1 = 2) -->
  <line x1="445" y1="93" x2="320" y2="118" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <text x="365" y="103" fill="#34d399" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Pick 2 (×2)</text>

  <line x1="515" y1="93" x2="600" y2="118" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrow-gray)" />
  <text x="570" y="103" fill="#94a3b8" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Skip 2</text>

  <!-- Depth 1 Nodes -->
  <rect x="250" y="118" width="130" height="26" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
  <text x="315" y="135" fill="#34d399" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">{2} • P = 2</text>

  <rect x="545" y="118" width="120" height="26" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.2" />
  <text x="605" y="135" fill="#94a3b8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">∅ • P = 1</text>

  <!-- Depth 2 Edges (x2 = 3) -->
  <line x1="315" y1="144" x2="265" y2="168" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <text x="265" y="156" fill="#34d399" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Pick 3 (×3)</text>

  <line x1="605" y1="144" x2="605" y2="168" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <text x="612" y="158" fill="#34d399" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Pick 3 (×3)</text>

  <!-- Depth 2 Nodes -->
  <rect x="200" y="168" width="130" height="26" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
  <text x="265" y="185" fill="#fbbf24" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">{2, 3} • P = 6</text>

  <rect x="545" y="168" width="120" height="26" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
  <text x="605" y="185" fill="#fbbf24" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">{3} • P = 3</text>

  <!-- Depth 3 Edges under {2, 3} (x3 = 4) -->
  <line x1="235" y1="194" x2="170" y2="218" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrow-rose)" />
  <text x="165" y="206" fill="#fb7185" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Pick 4 (×4)</text>

  <line x1="295" y1="194" x2="320" y2="218" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrow-gray)" />
  <text x="315" y="206" fill="#94a3b8" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Skip 4</text>

  <!-- Depth 3 Nodes under {2, 3} -->
  <!-- PRUNED NODE -->
  <rect x="135" y="218" width="130" height="36" rx="6" fill="#2a1218" stroke="#e11d48" stroke-width="1.8" filter="url(#shadow)" />
  <text x="200" y="233" fill="#fb7185" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">P = 24 &gt; 12</text>
  <text x="200" y="248" fill="#f43f5e" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">✗ PRUNED (Backtrack)</text>

  <!-- Continues to x4 -->
  <rect x="275" y="218" width="110" height="26" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.2" />
  <text x="330" y="235" fill="#cbd5e1" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">{2, 3} • P = 6</text>

  <!-- Depth 3 under {3} (Pick 4 -> Solution 1) -->
  <line x1="605" y1="194" x2="605" y2="218" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-emerald)" />
  <text x="612" y="208" fill="#34d399" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Pick 4 (×4)</text>

  <rect x="520" y="218" width="170" height="36" rx="6" fill="#062e20" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
  <text x="605" y="233" fill="#34d399" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">P = 3 × 4 = 12</text>
  <text x="605" y="248" fill="#6ee7b7" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">✓ SOLUTION 1: {3, 4}</text>

  <!-- Depth 4 Edge from {2, 3} (Pick 2 -> Solution 2) -->
  <line x1="330" y1="244" x2="330" y2="268" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-emerald)" />
  <text x="338" y="258" fill="#34d399" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Pick 2 (×2)</text>

  <rect x="245" y="268" width="170" height="36" rx="6" fill="#062e20" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
  <text x="330" y="283" fill="#34d399" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">P = 6 × 2 = 12</text>
  <text x="330" y="298" fill="#6ee7b7" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">✓ SOLUTION 2: {2, 3, 2}</text>

  <!-- Bottom Banner -->
  <rect x="145" y="310" width="550" height="16" rx="4" fill="#0f172a" />
  <text x="420" y="322" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Backtracking terminates doomed subtrees early without exploring their deeper descendants.</text>
</svg>