<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="720" height="260" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Binary Search Tree (BST) Ordering Invariant</text>
  <text x="360" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">For every node v: keys in left subtree &lt; key(v) &lt; keys in right subtree.</text>

  <g transform="translate(160, 55)">
    <!-- Root 5(200, 20) -->
    <line x1="200" y1="20" x2="100" y2="75" stroke="#64748b" stroke-width="2" />
    <line x1="200" y1="20" x2="300" y2="75" stroke="#64748b" stroke-width="2" />

    <!-- 3(100, 75) -> 1(50, 135) and 4(150, 135) -->
    <line x1="100" y1="75" x2="50" y2="135" stroke="#64748b" stroke-width="2" />
    <line x1="100" y1="75" x2="150" y2="135" stroke="#64748b" stroke-width="2" />

    <!-- 8(300, 75) -> 7(250, 135) and 9(350, 135) -->
    <line x1="300" y1="75" x2="250" y2="135" stroke="#64748b" stroke-width="2" />
    <line x1="300" y1="75" x2="350" y2="135" stroke="#64748b" stroke-width="2" />

    <!-- Nodes -->
    <circle cx="200" cy="20" r="16" fill="url(#grad-blue)" stroke="#fff" stroke-width="2" filter="url(#shadow)" />
    <text x="200" y="25" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">5</text>

    <circle cx="100" cy="75" r="15" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" />
    <text x="100" y="80" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">3</text>

    <circle cx="300" cy="75" r="15" fill="url(#grad-emerald)" stroke="#fff" stroke-width="1.5" />
    <text x="300" y="80" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">8</text>

    <circle cx="50" cy="135" r="13" fill="url(#grad-purple)" stroke="#fff" stroke-width="1.5" />
    <text x="50" y="139" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">1</text>

    <circle cx="150" cy="135" r="13" fill="url(#grad-purple)" stroke="#fff" stroke-width="1.5" />
    <text x="150" y="139" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">4</text>

    <circle cx="250" cy="135" r="13" fill="url(#grad-purple)" stroke="#fff" stroke-width="1.5" />
    <text x="250" y="139" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">7</text>

    <circle cx="350" cy="135" r="13" fill="url(#grad-purple)" stroke="#fff" stroke-width="1.5" />
    <text x="350" y="139" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">9</text>
  </g>

  <!-- Inorder banner -->
  <rect x="80" y="220" width="560" height="28" rx="6" fill="#182234" stroke="#334155" />
  <text x="360" y="238" fill="#34d399" font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">Inorder Traversal: 1, 3, 4, 5, 7, 8, 9 (Always Strictly Ascending Sorted!)</text>
</svg>