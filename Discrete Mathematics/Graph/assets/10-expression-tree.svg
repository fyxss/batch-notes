<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="100%" height="100%">

  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="720" height="260" rx="14" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="28" fill="#f8fafc" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Arithmetic Expression Tree for: (A × (B + C)) / D</text>
  <text x="360" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Operators reside exclusively at internal nodes; operands (variables/constants) reside at leaves.</text>

  <g transform="translate(180, 55)">
    <!-- Root / (180, 20) -->
    <line x1="180" y1="20" x2="100" y2="75" stroke="#64748b" stroke-width="2" />
    <line x1="180" y1="20" x2="260" y2="75" stroke="#64748b" stroke-width="2" />

    <!-- * (100, 75) -> A(50, 135) and + (150, 135) -->
    <line x1="100" y1="75" x2="50" y2="135" stroke="#64748b" stroke-width="2" />
    <line x1="100" y1="75" x2="150" y2="135" stroke="#64748b" stroke-width="2" />

    <!-- + (150, 135) -> B(110, 185) and C(190, 185) -->
    <line x1="150" y1="135" x2="110" y2="185" stroke="#64748b" stroke-width="2" />
    <line x1="150" y1="135" x2="190" y2="185" stroke="#64748b" stroke-width="2" />

    <!-- Nodes -->
    <circle cx="180" cy="20" r="16" fill="url(#grad-purple)" stroke="#fff" stroke-width="2" filter="url(#shadow)" />
    <text x="180" y="26" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">/</text>

    <circle cx="100" cy="75" r="15" fill="url(#grad-purple)" stroke="#fff" stroke-width="1.5" />
    <text x="100" y="81" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">×</text>

    <circle cx="260" cy="75" r="15" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" />
    <text x="260" y="80" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">D</text>

    <circle cx="50" cy="135" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" />
    <text x="50" y="140" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">A</text>

    <circle cx="150" cy="135" r="15" fill="url(#grad-purple)" stroke="#fff" stroke-width="1.5" />
    <text x="150" y="141" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">+</text>

    <circle cx="110" cy="185" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" />
    <text x="110" y="190" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">B</text>

    <circle cx="190" cy="185" r="14" fill="url(#grad-blue)" stroke="#fff" stroke-width="1.5" />
    <text x="190" y="190" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">C</text>
  </g>

  <!-- Notations Comparison -->
  <g transform="translate(40, 220)">
    <rect width="640" height="28" rx="6" fill="#182234" stroke="#334155" />
    <text x="320" y="19" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">Prefix: / * A + B C D   •   Infix: (A * (B + C)) / D   •   Postfix: A B C + * D /</text>
  </g>
</svg>